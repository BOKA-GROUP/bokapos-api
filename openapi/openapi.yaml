      properties:
        documentId: { type: string, format: uuid }
        environmentName: { type: string, enum: [demo] }
        ordinaryState: { type: string, enum: [prepared] }
        ordinaryRegistrationCheckedAt: { type: string, format: date-time }
        vatState: { type: string, enum: [not_started, submitted, verified, outcome_unknown] }
        calculationNumber: { type: string, nullable: true }
        payloadSha256: { type: string, nullable: true }
        vatRegistrationCheckedAt: { type: string, format: date-time, nullable: true }
        individualVatId: { type: integer, format: int64, nullable: true }
        verificationState: { type: string, enum: [verified, pdf_pending, facts_mismatch, readback_failed], nullable: true }
        externalStatus: { type: integer, enum: [0, 10, 20, 30], nullable: true }
