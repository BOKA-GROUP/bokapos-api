openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: BokaPOS API
  version: 1.0.0
  license:
    name: Proprietary, BOKA GROUP DOO
    identifier: LicenseRef-BOKA-Proprietary
  description: |
    High-level, multi-tenant fiscalization API operated by BOKA GROUP.
    The initial V-PFR-only release is restricted to electronic and other
    distance commerce. This contract intentionally does not expose the raw
    V-PFR request contract. Every operation declares `x-boka-implementation`
    as either `implemented` or `planned`; executable contract specifications
    require the implemented route/method set to match the runtime exactly.
servers:
  - url: https://api.bokapos.rs
    description: |
      The single BokaPOS deployment. Sandbox and production are not separate
      hosts: they are distinguished by the environment tag on the OAuth client
      credential and on the security element. Moving to production changes the
      credential, never the base URL.

      Every read and write is scoped to the caller's environment. A machine
      credential sees exactly the taxpayers, premises, security elements and
      documents of its own environment; an object of the other environment
      does not exist for it (404), and setup it registers belongs to its own
      environment. Portal users see both environments unless the organization
      hides its sandbox data (GET /v1/organization-settings), which happens
      automatically once a production element or credential is active.
security:
  - oauth2: []
tags:
  - name: Runtime
    description: Authenticated build and adapter readiness visible to integrations.
  - name: Fiscal documents
    description: Synchronous fiscalization and the searchable electronic journal.
  - name: Advance workflows
    description: Server-managed Advance Sale, Advance Refund, and final Sale chains.
  - name: Refund workflows
    description: Full or partial refunds and conditional cash-refund copies.
  - name: Proforma and Training workflows
    description: Bounded, server-managed Proforma and Training issuance and reference chains.
  - name: Receipt delivery
    description: Branded electronic delivery after successful fiscalization.
  - name: Operations
    description: Status and recovery visibility for fiscal and background work.
  - name: Catalogue
    description: Persistent product, service, price, GTIN, and tax-label management.
  - name: Receipt branding
    description: Versioned taxpayer receipt presentation with optional premise overrides.
  - name: Operator preferences
    description: Per-user cashier defaults for the signed-in customer operator.
  - name: Organization settings
    description: Organization-wide portal settings for customer humans, currently the sandbox data visibility.
  - name: Fiscal configuration
    description: PFR/SUF-provided tax configuration exposed read-only to integrations.
  - name: Taxpayers and premises
    description: Organization-scoped taxpayer and business-premise administration.
  - name: Human access
    description: Organization-scoped customer membership and accepted role administration.
  - name: BOKA control plane
    description: BOKA-only staff membership and platform authority administration.
  - name: Organization API credentials
    description: The customer's own view of its machine API credentials and the one-time secret pickup.
  - name: AI connections
    description: Owner- and Administrator-approved AI assistant connections for the BokaPOS MCP connector.
  - name: Security elements
    description: Secure onboarding and lifecycle management for premise-bound PFX credentials.
  - name: BOKA sandbox pool
    description: Staff-only pool of BOKA-owned sandbox elements assigned to customer organizations.
  - name: Billing
    description: Customer-visible licence state and the Owner billing overview; payment never happens on the platform.
  - name: BOKA licensing
    description: Root-only issuance of organization licences and recording of invoices issued outside the platform.
paths:
  /v1/runtime:
    get:
      tags: [Runtime]
      operationId: getRuntime
      x-boka-implementation: implemented
      summary: Read the authenticated tenant and fiscal-adapter readiness
      security:
        - oauth2: [tenant:read]
        - humanOidc: [tenant:read]
      parameters:
        - $ref: '#/components/parameters/StaffSupportContextHeader'
      responses:
        '200':
          description: Runtime context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeInfo' }

  /v1/operator-preferences:
    get:
      tags: [Operator preferences]
      operationId: getOperatorPreferences
      x-boka-implementation: implemented
      summary: Read cashier defaults for the signed-in customer user
      security:
        - humanOidc: [tenant:read]
      responses:
        '200':
          description: Current cashier defaults; cashierId is null until configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorPreference' }
    put:
      tags: [Operator preferences]
      operationId: putOperatorPreferences
      x-boka-implementation: implemented
      summary: Save cashier defaults for the signed-in customer user
      security:
        - humanOidc: [tenant:read]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperatorPreferenceWrite' }
      responses:
        '200':
          description: Saved cashier defaults
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorPreference' }
        '422': { $ref: '#/components/responses/ValidationError' }


  /v1/organization-settings:
    get:
      tags: [Organization settings]
      operationId: getOrganizationSettings
      x-boka-implementation: implemented
      summary: Read the organization's sandbox data visibility and its effective state
      description: |
        Customer humans only; machine credentials are refused because their
        view is fixed to their own environment at issuance. The effective state
        is what the signed-in user currently gets: with the default `auto`
        setting sandbox data is shown until the organization holds an active
        production security element or an active production API credential,
        and hidden from then on.
      security:
        - humanOidc: [tenant:read]
      responses:
        '200':
          description: Current organization settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationSettings' }
    put:
      tags: [Organization settings]
      operationId: putOrganizationSettings
      x-boka-implementation: implemented
      summary: Change the organization's sandbox data visibility
      description: |
        Owner or Administrator only. `shown` keeps sandbox data visible after
        go-live, `hidden` hides it regardless of readiness, `auto` restores
        the automatic rule. Every change is recorded as the customer audit
        event `organization-settings.sandbox-data-visibility-updated`.
        Machine credentials are never affected by this setting.
      security:
        - humanOidc: [tenant:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationSettingsWrite' }
      responses:
        '200':
          description: Saved organization settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationSettings' }
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/fiscal-documents:
    post:
      tags: [Fiscal documents]
      operationId: createFiscalDocument
      x-boka-implementation: implemented
      summary: Fiscalize a document synchronously
      description: |
        Accepts a business-level command and succeeds only after a signed
        V-PFR result has been durably recorded. A 503 response is not a
        fiscal receipt. When it carries `retryable: true`, nothing reached
        the V-PFR, and repeating the identical command under the same
        Idempotency-Key drives the same reserved operation (and RequestId)
        again after the same checks as a first attempt; the retry that
        finally issues the receipt answers 201. A 503 with
        `retryable: false` (an unknown outcome, or a deployment-side
        refusal) is answered from storage and is never resubmitted.
        Refund commands are rejected here and must use a server-managed
        workflow. Advance, Proforma, and Training chains must use their
        dedicated workflow APIs. An optional unitPriceBeforeDiscount is a
        Boka-local immutable display/audit fact; unitPrice is always the final
        reduced gross price sent to V-PFR. No discount field is invented in
        the supplier request. Repeating the identical command under the same
        Idempotency-Key after a 201 answers 200 with the stored document and
        never fiscalizes a second time; only the first 201 with
        fiscalized=true is the issuing of a receipt.
      security:
        - oauth2: [fiscal:write]
        - humanOidc: [fiscal:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FiscalDocumentCreate'
      responses:
        '200':
          description: Idempotent replay of the already fiscalized document under the same Idempotency-Key; no new receipt was issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalDocument'
        '201':
          description: Fiscalized document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalDocument'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/PfrUnavailable'
    get:
      tags: [Fiscal documents]
      operationId: listFiscalDocuments
      x-boka-implementation: implemented
      summary: Search the tenant electronic journal with stable keyset pagination
      description: |
        Returns durable fiscal-operation state ordered by createdAt and id,
        both descending. createdFrom and pfrFrom are inclusive; createdTo and
        pfrTo are exclusive. The opaque cursor continues the same ordering.
        A journal entry whose fiscalized value is false is not a fiscal receipt.
        Scoped to the caller's environment: a machine credential never sees
        documents of the other environment, and fetching one by id is 404.
      security:
        - oauth2: [fiscal:read]
        - humanOidc: [fiscal:read]
      parameters:
        - $ref: '#/components/parameters/TaxpayerFilter'
        - $ref: '#/components/parameters/PremiseFilter'
        - $ref: '#/components/parameters/FiscalDocumentFilter'
        - $ref: '#/components/parameters/FiscalDocumentStatusFilter'
        - $ref: '#/components/parameters/InvoiceTypeFilter'
        - $ref: '#/components/parameters/TransactionTypeFilter'
        - $ref: '#/components/parameters/CreatedFromFilter'
        - $ref: '#/components/parameters/CreatedToFilter'
        - $ref: '#/components/parameters/PfrFromFilter'
        - $ref: '#/components/parameters/PfrToFilter'
        - $ref: '#/components/parameters/IdempotencyKeyFilter'
        - $ref: '#/components/parameters/ClientReferenceFilter'
        - $ref: '#/components/parameters/PfrNumberFilter'
        - $ref: '#/components/parameters/CashierIdFilter'
        - $ref: '#/components/parameters/BuyerIdFilter'
        - $ref: '#/components/parameters/FiscalDocumentSearch'
        - $ref: '#/components/parameters/FiscalDocumentCursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of fiscal documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalDocumentPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/fiscal-documents/export:
    get:
      tags: [Fiscal documents]
      operationId: exportFiscalDocuments
      x-boka-implementation: implemented
      summary: Export the filtered tenant electronic journal as bounded deterministic CSV
      description: |
        Applies the same tenant-scoped filters and descending createdAt/id
        ordering as the electronic journal. The export contains at most 10,000
        safe projection rows and never includes the raw fiscal command, caller
        metadata, complete PFR response, official journal text, verification
        URL, signature data, or secret material. Text cells that could be
        interpreted as spreadsheet formulas are neutralized. If more than
        10,000 rows match, the request fails without returning a partial file.
      security:
        - oauth2: [fiscal:read]
        - humanOidc: [fiscal:read]
      parameters:
        - $ref: '#/components/parameters/TaxpayerFilter'
        - $ref: '#/components/parameters/PremiseFilter'
        - $ref: '#/components/parameters/FiscalDocumentFilter'
        - $ref: '#/components/parameters/FiscalDocumentStatusFilter'
        - $ref: '#/components/parameters/InvoiceTypeFilter'
        - $ref: '#/components/parameters/TransactionTypeFilter'
        - $ref: '#/components/parameters/CreatedFromFilter'
        - $ref: '#/components/parameters/CreatedToFilter'
        - $ref: '#/components/parameters/PfrFromFilter'
        - $ref: '#/components/parameters/PfrToFilter'
        - $ref: '#/components/parameters/IdempotencyKeyFilter'
        - $ref: '#/components/parameters/ClientReferenceFilter'
        - $ref: '#/components/parameters/PfrNumberFilter'
        - $ref: '#/components/parameters/CashierIdFilter'
        - $ref: '#/components/parameters/BuyerIdFilter'
        - $ref: '#/components/parameters/FiscalDocumentSearch'
      responses:
        '200':
          description: Complete filtered journal CSV in stable descending order
          headers:
            Boka-Export-Schema-Version:
              schema: { type: string, const: boka-fiscal-journal-csv-v2 }
            Content-Disposition:
              schema: { type: string }
              description: Attachment filename for the journal CSV.
          content:
            text/csv:
              schema: { type: string }
        '422':
          description: Invalid filters or more than 10,000 matching rows
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ValidationProblem' }
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCode' }

  /v1/fiscal-documents/{fiscalDocumentId}/copies:
    post:
      tags: [Fiscal documents]
      operationId: createFiscalDocumentCopy
      x-boka-implementation: implemented
      summary: Issue an official Копија of a fiscalized document
      description: |
        Issues a Copy (Копија Продаја or Копија Рефундација) of a fiscalized
        Normal or Advance document. The copy is built on the server from the
        stored original: the same items, payments, buyer identification and
        stored buyer lines, referenced to the original's PFR number and time,
        with the cashier given here. It is signed by the V-PFR as a new
        document and prints ОВО НИЈЕ ФИСКАЛНИ РАЧУН; a Копија Рефундација
        prints the customer signature line. Copy, Proforma and Training
        documents cannot be copied (422 COPY_SOURCE_NOT_COPYABLE), nor can a
        document that is not fiscalized (422 COPY_SOURCE_NOT_FISCALIZED). Same
        idempotency and outcome rules as createFiscalDocument.
      security:
        - oauth2: [fiscal:write]
        - humanOidc: [fiscal:write]
      parameters:
        - $ref: '#/components/parameters/FiscalDocumentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FiscalDocumentCopyCreate'
      responses:
        '200':
          description: Idempotent replay of the already fiscalized copy under the same Idempotency-Key; no new document was issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalDocument'
        '201':
          description: Fiscalized copy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalDocument'
        '404':
          description: The original does not exist in this organization (code FISCAL_DOCUMENT_NOT_FOUND)
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/PfrUnavailable'

  /v1/fiscal-documents/{fiscalDocumentId}:
    get:
      tags: [Fiscal documents]
      operationId: getFiscalDocument
      x-boka-implementation: implemented
      summary: Retrieve one fiscal document
      security:
        - oauth2: [fiscal:read]
        - humanOidc: [fiscal:read]
      parameters:
        - $ref: '#/components/parameters/FiscalDocumentId'
      responses:
        '200':
          description: Fiscal document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalDocument'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/fiscal-documents/turnover-report:
    get:
      tags: [Fiscal documents]
      operationId: getTurnoverReport
      x-boka-implementation: implemented
      summary: Report immutable Normal and Advance turnover for a selected PFR-time period
      description: |
        Aggregates only tenant-scoped FISCALIZED Normal (Promet) and Advance
        (Avans) receipts whose authoritative PFR signing time is within the
        inclusive pfrFrom and exclusive pfrTo bounds. Sale and Refund amounts
        remain separate positive totals; the API does not infer a net value.
        Payment data comes from the hash-verified canonical request and tax
        bases/tax amounts come from the hash-verified complete PFR response.
        This is a Boka-local immutable report, not the SUF portal daily report;
        it does not claim SUF-only knowledge about missing or scanned receipts.
      security:
        - oauth2: [fiscal:read]
        - humanOidc: [fiscal:read]
      parameters:
        - name: taxpayerId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: businessPremiseId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: pfrFrom
          in: query
          required: true
          description: Inclusive lower bound for authoritative PFR signing time. Any RFC 3339 offset is accepted (Z, +00:00, +02:00) and compared as an instant.
          schema: { type: string, format: date-time }
        - name: pfrTo
          in: query
          required: true
          description: Exclusive upper bound for authoritative PFR signing time. Any RFC 3339 offset is accepted and compared as an instant.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Immutable local turnover report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TurnoverReport' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A selected receipt failed source-integrity validation or totals exceeded the supported decimal range
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCode' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/fiscal-documents/turnover-report/export:
    get:
      tags: [Fiscal documents]
      operationId: exportTurnoverReport
      x-boka-implementation: implemented
      summary: Export the immutable local turnover report as deterministic CSV
      description: |
        Reuses the exact same hash-reverified BOKA_LOCAL_IMMUTABLE_PFR report
        result as the JSON operation. The normalized CSV contains SUMMARY,
        FIRST_DOCUMENT, LAST_DOCUMENT, PAYMENT_TOTAL, and TAX_TOTAL record
        types. Sale and Refund remain separate positive amounts. This is not a
        SUF portal report and contains no official receipt journal or raw PFR
        payload.
      security:
        - oauth2: [fiscal:read]
        - humanOidc: [fiscal:read]
      parameters:
        - name: taxpayerId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: businessPremiseId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: pfrFrom
          in: query
          required: true
          description: Inclusive lower bound for authoritative PFR signing time. Any RFC 3339 offset is accepted (Z, +00:00, +02:00) and compared as an instant.
          schema: { type: string, format: date-time }
        - name: pfrTo
          in: query
          required: true
          description: Exclusive upper bound for authoritative PFR signing time. Any RFC 3339 offset is accepted and compared as an instant.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Complete normalized turnover-report CSV
          headers:
            Boka-Export-Schema-Version:
              schema: { type: string, const: boka-turnover-report-csv-v1 }
            Content-Disposition:
              schema: { type: string }
              description: Attachment filename containing the exact report scope and UTC bounds.
          content:
            text/csv:
              schema: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A selected receipt failed source-integrity validation or totals exceeded the supported decimal range
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCode' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/fiscal-documents/{fiscalDocumentId}/representations/{representationFormat}:
    get:
      tags: [Fiscal documents]
      operationId: getFiscalDocumentRepresentation
      x-boka-implementation: implemented
      summary: Retrieve one deterministic representation of a fiscalized receipt
      description: |
        Generates the selected representation only from a tenant-scoped FISCALIZED
        operation after rechecking the canonical request and complete original PFR
        response hashes. official-text is the exact stored supplier journal.
        canonical-json omits caller metadata and opaque encrypted/signature values.
        The direct PDF and PNG preview layouts keep the verification QR at
        45 mm. Fixed media use only bundled local rendering resources and include no
        network-loaded content. No representation is generated for an unresolved,
        rejected, unavailable, corrupt, or non-fiscalized operation.
      security:
        - oauth2: [fiscal:read]
        - humanOidc: [fiscal:read]
      parameters:
        - $ref: '#/components/parameters/FiscalDocumentId'
        - $ref: '#/components/parameters/ReceiptRepresentationFormat'
      responses:
        '200':
          description: Selected immutable receipt representation
          headers:
            ETag:
              schema: { type: string }
              description: SHA-256 entity tag of the generated representation bytes.
            Boka-Receipt-Representation-Version:
              schema: { type: string, const: boka-receipt-representation-v27 }
            Boka-Receipt-Source-Sha256:
              schema: { type: string, pattern: '^[0-9a-f]{64}$' }
              description: Stable hash joining the verified canonical request and original PFR-response hashes.
            Boka-Receipt-Branding-Sha256:
              schema: { type: string, pattern: '^[0-9a-f]{64}$' }
              description: Present only for a receipt that captured an immutable customer-branding revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptCanonicalPackage' }
            text/plain:
              schema:
                type: string
                description: Exact official V-PFR journal with no Boka-added text.
            image/svg+xml:
              schema:
                type: string
                description: QR encoding the exact stored HTTPS verification URL with a quiet zone.
            application/pdf:
              schema:
                type: string
                format: binary
                description: Direct A4, 80 mm, or 58 mm PDF selected by representationFormat.
            image/png:
              schema:
                type: string
                format: binary
                description: Direct 80 mm receipt preview generated from the immutable package.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Receipt unavailable or stored source integrity validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCode' }

  /v1/refund-workflows:
    post:
      tags: [Refund workflows]
      operationId: createRefundWorkflow
      x-boka-implementation: implemented
      summary: Refund an explicitly identified Normal Sale
      description: |
        Supports full and partial Normal Refunds. Boka-issued originals are
        resolved only within the exact taxpayer and premise, and cumulative
        quantities are prevented from exceeding each stored original line.
        When any returned payment is cash, Boka automatically issues the
        required Copy Refundation and renders its customer-signature line.
        This first bounded workflow accepts only a Boka-stored original; external
        originals remain unsupported because their cumulative returned quantity
        cannot be independently proven. Normal fiscal traffic remains governed
        by the same disabled-by-default provider and uncertain-outcome safeguards.
      security:
        - oauth2: [refund:write]
        - humanOidc: [refund:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundWorkflowCreate'
      responses:
        '200':
          description: Idempotent replay of a completed refund workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundWorkflow'
        '201':
          description: Completed refund workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundWorkflow'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: The refund workflow is incomplete; no missing fiscal step is claimed as issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundWorkflow' }

  /v1/proforma-training-workflows:
    post:
      tags: [Proforma and Training workflows]
      operationId: createProformaTrainingWorkflow
      x-boka-implementation: implemented
      summary: Issue one bounded Proforma or Training document
      description: |
        Accepts only Proforma or Training transactions through the dedicated
        workflow scope. Training Sale forbids a reference. Training
        Refund must reference an exact Boka-issued Training Sale. Proforma Sale
        may omit a reference or reference a Boka-issued Proforma Sale or Refund;
        Proforma Refund must reference a Boka-issued Proforma Sale. Refunds must
        exactly reproduce every source item and payment, identify the buyer,
        and only one unresolved or completed full refund may reserve a source.
        External and legacy references remain outside this bounded workflow.
        An unknown PFR outcome is terminal for automatic submission and an
        idempotent replay never creates a second fiscal request.
      security:
        - oauth2: [proforma-training:write]
        - humanOidc: [proforma-training:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProformaTrainingWorkflowCreate'
      responses:
        '200':
          description: Idempotent replay of a completed workflow
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProformaTrainingWorkflow' }
        '201':
          description: Fiscalized Proforma or Training document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProformaTrainingWorkflow' }
        '202':
          description: The request is durably reserved but has not been submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProformaTrainingWorkflow' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Idempotency, source-reservation, or terminal workflow conflict
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ProformaTrainingWorkflowConflict'
                  - $ref: '#/components/schemas/ProformaTrainingWorkflow'
        '422':
          description: The command violates a Boka or fiscal rule, or PFR definitively rejected the reserved operation
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ValidationProblem' }
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorCode'
                  - $ref: '#/components/schemas/ProformaTrainingWorkflow'
        '503':
          description: No fiscal receipt is claimed; the workflow is unavailable or its outcome is unresolved
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ProformaTrainingWorkflow'
                  - $ref: '#/components/schemas/FiscalUnavailableError'

