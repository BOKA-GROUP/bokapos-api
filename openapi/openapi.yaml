        invoiceId: { type: [integer, 'null'], format: int64 }
        salesInvoiceId: { type: [integer, 'null'], format: int64 }
        purchaseInvoiceId: { type: [integer, 'null'], format: int64 }
        verificationState: { type: [string, 'null'], enum: [verified, pdf_pending, readback_failed, facts_mismatch, null] }
        externalStatus: { type: [string, 'null'], description: Observed SEF status; never proof of reconciled bank payment }
        retryAllowed: { type: boolean, const: false }

    InvoiceBillingProfile:
      type: object
      additionalProperties: false
      required: [legalName, taxIdentifier, registrationNumber, address, city, kind, publicFundsCode, email, electronicDeliveryConsent]
      properties:
        legalName: { type: string, minLength: 1, maxLength: 256 }
        taxIdentifier: { type: string, pattern: '^[0-9]{9}$', description: Valid Serbian PIB; BOKA issuer PIB is refused. }
        registrationNumber: { type: string, pattern: '^[0-9]{8}$' }
        address: { type: string, minLength: 1, maxLength: 256 }
        city: { type: string, minLength: 1, maxLength: 128 }
        kind: { type: string, enum: [company, entrepreneur, association, public-sector] }
        publicFundsCode: { type: string, nullable: true, pattern: '^[0-9]{5}$', description: JBKJS required for public-sector buyers and null otherwise. }
        email: { type: string, format: email, maxLength: 254 }
        electronicDeliveryConsent: { type: boolean, description: Root-recorded consent for ordinary PDF delivery; not proof of SEF registration. }
    InvoiceCustomerWrite:
      type: object
      additionalProperties: false
      required: [expectedVersion, organizationId, profile]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        organizationId: { type: string, format: uuid, nullable: true }
        profile: { $ref: '#/components/schemas/InvoiceBillingProfile' }
        accountSourceSha256: { type: string, nullable: true, pattern: '^[a-f0-9]{64}$', description: Required for organization links; exact current all-account review hash. Null for standalone buyers. }
        termsReference: { type: string, nullable: true, maxLength: 100, description: Required for organization links; confirms the customer accepted the accountTermsReference returned by the review, including invoice email delivery. }
    InvoiceCustomer:
      type: object
      additionalProperties: false
      required: [id, organizationId, version, profile, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid, nullable: true }
        version: { type: integer, format: int64, minimum: 1 }
        profile: { $ref: '#/components/schemas/InvoiceBillingProfile' }
        updatedAt: { type: string, format: date-time }
    InvoiceIssuer:
      type: object
      additionalProperties: false
      required: [legalName, taxIdentifier, registrationNumber, address, city, email, bankAccount, responsiblePerson]
      properties:
        legalName: { type: string }
        taxIdentifier: { type: string }
        registrationNumber: { type: string }
        address: { type: string }
        city: { type: string }
        email: { type: string }
        bankAccount: { type: string }
        responsiblePerson: { type: string }
    InvoiceCustomerPage:
      type: object
      additionalProperties: false
      required: [items, organizations, accounts, accountTermsReference, today, issuer, productionIssuanceMode, productionEmailMode, monthlyPreparationEnabled, monthlyIssueAndSendEnabled]
      properties:
        accounts: { type: array, items: { $ref: '#/components/schemas/BillingAccountReview' } }
        accountTermsReference: { type: string, description: Exact TOS version for explicit Root-recorded customer acceptance. No acceptance is inferred for future accounts. }
        items: { type: array, items: { $ref: '#/components/schemas/InvoiceCustomer' } }
        organizations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
        today: { type: string, format: date }
        productionIssuanceMode: { type: string, enum: [disabled, exact_id, root_review], description: Configuration gate only; does not certify draft readiness or authorize issuance. }
        productionEmailMode: { type: string, enum: [disabled, exact_id, root_review], description: Independent configuration gate; each message still requires current Owner and exact preparation review. }
        monthlyPreparationEnabled: { type: boolean, description: Existing monthly draft scheduler enabled; each customer additionally requires a current policy. Does not issue or send. }
        monthlyIssueAndSendEnabled: { type: boolean, description: Separate automatic issuance and PDF delivery enabled; each customer additionally requires explicit current issueAndSend authority. }
        demoDocumentsEnabled: { type: boolean, description: True only in Development with explicit demo-document preparation enabled. }
        demoEmailRecipient: { type: string, nullable: true, description: Explicitly allowed demo mailbox; null when demo email is disabled. }
        demoSefCustomerId: { type: [string, 'null'], format: uuid, description: Explicitly configured isolated demo buyer; null when demo SEF is disabled. }
        issuer: { $ref: '#/components/schemas/InvoiceIssuer' }
    BillingAccountReview:
      type: object
      additionalProperties: false
      required: [organizationId, organizationName, customerId, state, company, ownerEmail, sourceSha256, blockers]
      properties:
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        customerId: { type: string, format: uuid, nullable: true }
        state: { type: string, enum: [unlinked, current, needs-review, blocked] }
        ownerEmail: { type: string, nullable: true, description: Email of exactly one active identity-linked Owner; never the historical invitation email. }
        sourceSha256: { type: string, pattern: '^[a-f0-9]{64}$', description: Opaque digest of the exact onboarding taxpayer and current Owner facts; rechecked on save and before production issuance. }
        blockers: { type: array, items: { type: string } }
        company:
          type: object
          nullable: true
          additionalProperties: false
          description: Company referenced by the original account provisioning; never a first-taxpayer or sandbox-pool fallback. Missing data needs review.
          required: [legalName, taxIdentifier, registrationNumber, address, city]
          properties:
            legalName: { type: string }
            taxIdentifier: { type: string }
            registrationNumber: { type: string }
            address: { type: string }
            city: { type: string }
    InvoiceServiceItem:
      type: object
      additionalProperties: false
      required: [description, quantity, unitGrossPrice]
      properties:
        description: { type: string, minLength: 1, maxLength: 256 }
        quantity: { type: number, minimum: 0, exclusiveMinimum: true, maximum: 1000000, multipleOf: 0.0001 }
        unitGrossPrice: { type: number, minimum: 0, maximum: 1000000000, multipleOf: 0.01 }
    InvoiceDraftCreate:
      type: object
      additionalProperties: false
      required: [requestId, customerId, customerVersion, closedPeriodId, issueOn, supplyOn, dueOn]
      properties:
        paymentCode: { type: string, enum: ["220", "221"], default: "220" }
        requestId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        customerVersion: { type: integer, format: int64, minimum: 1 }
        closedPeriodId: { type: string, format: uuid, nullable: true }
        issueOn: { type: string, format: date }
        supplyOn: { type: string, format: date }
        dueOn: { type: string, format: date }
        note: { type: string, nullable: true, maxLength: 1000 }
        items: { type: array, nullable: true, maxItems: 100, items: { $ref: '#/components/schemas/InvoiceServiceItem' } }
    InvoiceDraftUpdate:
      type: object
      additionalProperties: false
      required: [expectedVersion, customerVersion, issueOn, supplyOn, dueOn]
      properties:
        paymentCode: { type: string, enum: ["220", "221"], default: "220" }
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        customerVersion: { type: integer, format: int64, minimum: 1 }
        issueOn: { type: string, format: date }
        supplyOn: { type: string, format: date }
        dueOn: { type: string, format: date }
        note: { type: string, nullable: true, maxLength: 1000 }
        items: { type: array, nullable: true, maxItems: 100, items: { $ref: '#/components/schemas/InvoiceServiceItem' } }
    InvoiceDraftApproval:
      type: object
      additionalProperties: false
      required: [expectedVersion, expectedSha256]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        expectedSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    InvoiceDraftLine:
      type: object
      additionalProperties: false
      required: [description, detail, quantity, unitCode, unitGrossPrice, netAmount, vatRate, vatAmount, grossAmount]
      properties:
        description: { type: string }
        detail: { type: string, nullable: true }
        quantity: { type: number }
        unitCode: { type: string, enum: [C62] }
        unitGrossPrice: { type: number }
        netAmount: { type: number }
        vatRate: { type: number, enum: [0.2] }
        vatAmount: { type: number }
        grossAmount: { type: number }
    InvoiceDraftContent:
      type: object
      additionalProperties: false
      required: [schemaVersion, issuer, customerVersion, customer, sourceKind, period, sourceSha256, issueOn, supplyOn, dueOn, note, lines, netTotal, vatTotal, grossTotal, currency]
      properties:
        payableRoundingAmount: { type: number, description: "BT-114 payable adjustment preserving agreed gross charges; tax is rounded at category level in schema 2." }
        paymentCode: { type: string, enum: ["220", "221"] }
        schemaVersion: { type: integer, enum: [1, 2] }
        issuer: { $ref: '#/components/schemas/InvoiceIssuer' }
        customerVersion: { type: integer, format: int64 }
        customer: { $ref: '#/components/schemas/InvoiceBillingProfile' }
        sourceKind: { type: string, enum: [monthly, manual] }
        period: { type: string, nullable: true }
        sourceSha256: { type: string, nullable: true }
        issueOn: { type: string, format: date }
        supplyOn: { type: string, format: date }
        dueOn: { type: string, format: date }
        note: { type: string, nullable: true }
        lines: { type: array, items: { $ref: '#/components/schemas/InvoiceDraftLine' } }
        netTotal: { type: number }
        vatTotal: { type: number }
        grossTotal: { type: number, minimum: 0, exclusiveMinimum: true }
        currency: { type: string, enum: [RSD] }
    InvoiceDraft:
      type: object
      additionalProperties: false
      required: [id, customerId, organizationId, closedPeriodId, version, contentSha256, state, blockingReason, approvedAt, createdAt, updatedAt, content, documentId]
      properties:
        documentId: { type: string, format: uuid, nullable: true }
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid, nullable: true }
        closedPeriodId: { type: string, format: uuid, nullable: true }
        version: { type: integer, format: int64 }
        contentSha256: { type: string }
        state: { type: string, enum: [draft, approved, needs-review, prepared] }
        blockingReason: { type: string, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true, description: Null when the saved approval is no longer effective. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        content: { $ref: '#/components/schemas/InvoiceDraftContent' }
    InvoiceDocument:
      type: object
      additionalProperties: false
      required: [id, invoiceNumber, state, period, issuedOn, dueOn, grossAmount, pdfSha256, rendererVersion]
      properties:
        id: { type: string, format: uuid }
        invoiceNumber: { type: string }
        state: { type: string, enum: [demo, prepared, issued] }
        period: { type: string, nullable: true }
        issuedOn: { type: string, format: date }
        dueOn: { type: string, format: date }
        grossAmount: { type: number }
        pdfSha256: { type: string }
        rendererVersion: { type: string }
    InvoiceDocumentPage:
      type: object
      additionalProperties: false
      required: [items, page, hasMore]
      properties:
        items: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/InvoiceDocument' } }
        page: { type: integer }
        hasMore: { type: boolean }
    InvoiceDraftPage:
      type: object
      additionalProperties: false
      required: [items, page, hasMore]
      properties:
        items: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/InvoiceDraft' } }
        page: { type: integer }
        hasMore: { type: boolean }

    RuntimeInfo:
      type: object
      additionalProperties: false
      required: [manufacturer, productName, esirNumber, softwareVersion, buildCommit, instanceId, organizationId, clientId, fiscalEndpointsEnabled, pfrAdapter]
      properties:
        manufacturer:
          type: string
          enum: [BOKA GROUP DOO]
        productName:
          type: string
          enum: [BokaPOS]
        esirNumber:
          type: string
          maxLength: 60
          description: |
            The ESIR number printed on every fiscal receipt, as the Tax
            Administration approval number and the declared product version
            separated by a slash. Empty while no approval decision has assigned
            one. This is not the deployed build; see softwareVersion.
          examples: ["1774/1.0.1", ""]
        softwareVersion:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[0-9A-Za-z][0-9A-Za-z.+-]{0,63}$'
        buildCommit:
          type: string
          description: Exact 40-character Git commit; only Development may report the explicit unversioned-development placeholder.
        instanceId:
          type: string
          minLength: 1
          maxLength: 128
          description: Deployment-owned ESIR software instance identity; never a tenant, OAuth client, certificate, or approval number.
        organizationId: { type: string, format: uuid }
        clientId: { type: string }
        fiscalEndpointsEnabled: { type: boolean }
        pfrAdapter: { type: string, enum: [configured, not-configured] }

    InvoiceType:
      type: string
      enum: [NORMAL, PROFORMA, COPY, TRAINING, ADVANCE]
    TransactionType:
      type: string
      enum: [SALE, REFUND]
    PaymentType:
      type: string
      enum: [OTHER, CASH, CARD, CHECK, WIRE_TRANSFER, VOUCHER, INSTANT_PAYMENT]
    FiscalDocumentStatus:
      type: string
      enum: [RECEIVED, VALIDATED, SUBMITTING, FISCALIZED, REJECTED, NOT_FISCALIZED, OUTCOME_UNKNOWN, RECONCILING]

    FiscalDocumentCreate:
      type: object
      additionalProperties: false
      required:
        - taxpayerId
        - businessPremiseId
        - clientReference
        - invoiceType
        - transactionType
        - cashier
        - items
        - payments
      properties:
        taxpayerId: { type: string, format: uuid }
        businessPremiseId: { type: string, format: uuid }
        clientReference:
          type: string
          description: Caller-owned order, invoice, or transaction reference.
        invoiceType: { $ref: '#/components/schemas/InvoiceType' }
        transactionType: { $ref: '#/components/schemas/TransactionType' }
        cashier: { $ref: '#/components/schemas/Cashier' }
        buyer: { $ref: '#/components/schemas/Buyer' }
        reference: { $ref: '#/components/schemas/ReferenceTarget' }
        transactionOccurredAt:
          type: string
          format: date-time
          description: Accepted only for an Advance Sale containing a wire-transfer payment, where the official earlier-payment ESIR-time rule applies; it never overrides PFR time.
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/LineItem' }
        payments:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Payment' }
        commercialFooter:
          type: string
          description: Non-fiscal text rendered only in the permitted area outside the fiscal boundary.
        metadata:
          type: object
          additionalProperties: { type: string }
          description: Non-fiscal caller metadata; never sent as a substitute for a mandated field.

    FiscalDocument:
      type: object
      required:
        - id
        - taxpayerId
        - businessPremiseId
        - idempotencyKey
        - clientReference
        - invoiceType
        - transactionType
        - cashierId
        - status
        - fiscalized
        - createdAt
        - updatedAt
        - retryable
      properties:
        id: { type: string, format: uuid }
        taxpayerId: { type: string, format: uuid }
        businessPremiseId: { type: string, format: uuid }
        idempotencyKey: { type: string }
        clientReference: { type: string }
        invoiceType: { $ref: '#/components/schemas/InvoiceType' }
        transactionType: { $ref: '#/components/schemas/TransactionType' }
        cashierId: { type: string }
        buyerId: { type: [string, 'null'] }
        buyerDetails:
          description: The buyer's company-registry facts stored with the document at reservation and printed under the buyer identification. Null when the buyer is not a domestic company (prefixes 10, 12, 14 with a valid PIB) or the register could not answer at issuance.
          oneOf:
            - $ref: '#/components/schemas/FiscalBuyerDetails'
            - type: 'null'
        status: { $ref: '#/components/schemas/FiscalDocumentStatus' }
        fiscalized: { type: boolean }
        failureCode: { type: [string, 'null'] }
        pfrRejection:
          description: Present only on a single-document read of a REJECTED operation. The V-PFR's own validation result, bounded to the property path of the caller's request and the supplier's numeric codes (2310 invalid tax label; 2800 to 2808 required, length, range, value, format and list-size validation). Lists never carry it.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 10
                  items:
                    type: object
                    additionalProperties: false
                    required: [property, codes]
                    properties:
                      property: { type: string, maxLength: 120 }
                      codes:
                        type: array
                        maxItems: 5
                        items: { type: string, maxLength: 16 }
        retryable: { type: boolean }
        pfr:
          oneOf:
            - $ref: '#/components/schemas/PfrResult'
            - type: 'null'
        receipt:
          oneOf:
            - $ref: '#/components/schemas/ReceiptRepresentations'
            - type: 'null'
        reference:
          $ref: '#/components/schemas/ResolvedReference'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TurnoverReport:
      type: object
      additionalProperties: false
      required:
        - source
        - periodBasis
        - amountConvention
        - taxpayerId
        - businessPremiseId
        - pfrFrom
        - pfrTo
        - documentCount
        - firstDocument
        - lastDocument
        - paymentTotals
        - taxTotals
      properties:
        source: { type: string, const: BOKA_LOCAL_IMMUTABLE_PFR }
        periodBasis: { type: string, const: PFR_SDC_TIME }
        amountConvention: { type: string, const: SALE_REFUND_SEPARATE }
        taxpayerId: { type: string, format: uuid }
        businessPremiseId: { type: string, format: uuid }
        pfrFrom:
          type: string
          format: date-time
          description: Inclusive authoritative PFR signing-time bound.
        pfrTo:
          type: string
          format: date-time
          description: Exclusive authoritative PFR signing-time bound.
        documentCount: { type: integer, format: int64, minimum: 0 }
        firstDocument:
          oneOf:
            - $ref: '#/components/schemas/TurnoverBoundary'
            - type: 'null'
        lastDocument:
          oneOf:
            - $ref: '#/components/schemas/TurnoverBoundary'
            - type: 'null'
        paymentTotals:
          type: array
          items: { $ref: '#/components/schemas/TurnoverPaymentTotal' }
        taxTotals:
          type: array
          items: { $ref: '#/components/schemas/TurnoverTaxTotal' }

    TurnoverBoundary:
      type: object
      additionalProperties: false
      required: [fiscalDocumentId, pfrInvoiceNumber, pfrTime]
      properties:
        fiscalDocumentId: { type: string, format: uuid }
        pfrInvoiceNumber: { type: string }
        pfrTime: { type: string, format: date-time }

    TurnoverPaymentTotal:
      type: object
      additionalProperties: false
      required: [securityElementJid, paymentType, saleAmount, refundAmount]
      properties:
        securityElementJid: { type: string }
        paymentType: { $ref: '#/components/schemas/PaymentType' }
        saleAmount: { type: number, minimum: 0 }
        refundAmount: { type: number, minimum: 0 }

    TurnoverTaxTotal:
      type: object
      additionalProperties: false
      required:
        - invoiceType
        - categoryType
        - label
        - rate
        - categoryName
        - saleTaxableAmount
        - saleTaxAmount
        - saleTotalAmount
        - refundTaxableAmount
        - refundTaxAmount
        - refundTotalAmount
      properties:
        invoiceType:
          type: string
          enum: [NORMAL, ADVANCE]
        categoryType: { type: integer, minimum: 0, maximum: 2 }
        label: { type: string }
        rate: { type: number, minimum: 0 }
        categoryName: { type: string }
        saleTaxableAmount:
          type: number
          minimum: 0
          description: Sum of the Boka-derived taxable base per label (see ReceiptCanonicalTaxItem.taxableAmountPerLabel) over the Sale documents in the period; four decimals, as the V-PFR tax amounts it is reconciled with.
        saleTaxAmount:
          type: number
          minimum: 0
          description: Sum of the V-PFR signed tax amounts for the label over the Sale documents in the period.
        saleTotalAmount:
          type: number
          minimum: 0
          description: Gross of the receipt lines carrying the label over the Sale documents in the period (taxable base plus tax).
        refundTaxableAmount: { type: number, minimum: 0, description: As saleTaxableAmount, over the Refund documents. }
        refundTaxAmount: { type: number, minimum: 0, description: As saleTaxAmount, over the Refund documents. }
        refundTotalAmount: { type: number, minimum: 0, description: As saleTotalAmount, over the Refund documents. }

    Cashier:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string }
        displayName: { type: string }

    Buyer:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Official prefix and value, for example 10:123456789.
        optionalField:
          type: string
          description: >-
            Official buyer-cost-center prefix and value where applicable, printed as
            Опционо поље купца. Allowed only on a Normal Sale: any other invoice type
            or transaction type is rejected with 422, because the official manual
            testing procedure lists the field appearing on a receipt that is not a
            Промет Продаја as a reason to reject an ESIR. A Copy of a Normal Sale that
            carried it is issued without it for the same reason, and closing an advance
            case applies it only to the final Normal Sale, never to the closing Advance
            Refund.

    LineItem:
      type: object
      additionalProperties: false
      required: [name, quantity, unitPrice, taxLabels]
      properties:
        catalogProductId:
          type: string
          format: uuid
          description: Optional; arbitrary inline items are permitted.
        name: { type: string, minLength: 1, maxLength: 2048 }
        unitOfMeasure:
          type: string
          minLength: 1
          maxLength: 50
          description: "Required on every item except the codebook advance literals (10: Аванс (Ђ) and siblings), which are prescribed verbatim without a unit. The API refuses any other item without one (422, Items.UnitOfMeasure) and composes it into the signed item name as name/unit."
        quantity:
          type: number
          minimum: 0.001
          maximum: 99999999999.999
          multipleOf: 0.001
          description: V-PFR Decimal(14,3).
        unitPrice:
          type: number
          minimum: 0
          maximum: 999999999999999999999999.99
          multipleOf: 0.01
          description: Final gross unit price sent to V-PFR as Decimal(28,4). Boka applies the mandated fiscal rounding rules.
        unitPriceBeforeDiscount:
          type: number
          minimum: 0
          maximum: 999999999999999999999999.9999
          multipleOf: 0.0001
          description: Optional Boka-local immutable gross unit price before discount. When present it must be greater than unitPrice; it is displayed outside the exact PFR journal and is never sent as a supplier field.
        gtin: { type: string, minLength: 8, maxLength: 14 }
        taxLabels:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }

    Payment:
      type: object
      additionalProperties: false
      required: [type, amount]
      properties:
        type: { $ref: '#/components/schemas/PaymentType' }
        amount:
          type: number
          minimum: 0
          maximum: 999999999999999999999999.99
          multipleOf: 0.01
          description: At most two decimals (the V-PFR rejects more with validation code 2804); the field type on the wire is Decimal(28,4).

    ReferenceTarget:
      oneOf:
        - $ref: '#/components/schemas/BokaDocumentReference'
        - $ref: '#/components/schemas/ExternalFiscalReference'

    BokaDocumentReference:
      type: object
      additionalProperties: false
      required: [source, fiscalDocumentId]
      properties:
        source: { type: string, const: BOKA }
        fiscalDocumentId: { type: string, format: uuid }

    ExternalFiscalReference:
      type: object
      additionalProperties: false
      required: [source, pfrNumber, pfrTime, invoiceType, transactionType]
      properties:
        source: { type: string, const: EXTERNAL }
        pfrNumber: { type: string }
        pfrTime: { type: string, format: date-time }
        invoiceType: { $ref: '#/components/schemas/InvoiceType' }
        transactionType: { $ref: '#/components/schemas/TransactionType' }

    ResolvedReference:
      type: object
      required: [pfrNumber, pfrTime]
      properties:
        fiscalDocumentId: { type: string, format: uuid }
        pfrNumber: { type: string }
        pfrTime: { type: string, format: date-time }

    PfrResult:
      type: object
      description: Safe journal subset; opaque internal fiscal data and signature values are never exposed.
      required: [invoiceNumber, sdcTime, requestedBy, signedBy, totalAmount, verificationUrl, journal]
      properties:
        invoiceNumber: { type: string }
        sdcTime: { type: string, format: date-time }
        requestedBy: { type: string }
        signedBy: { type: string }
        transactionTypeCounter:
          type: [integer, 'null']
          description: V-PFR transaction-type counter (the left half of the printed counter). Null when the stored receipt does not carry it; the printed counter is always in the journal text.
        totalCounter:
          type: [integer, 'null']
          description: V-PFR total counter (the right half of the printed counter and the last segment of invoiceNumber). Null under the same condition as transactionTypeCounter.
        invoiceCounterExtension:
          type: [string, 'null']
          description: Official Cyrillic invoice/transaction type pair printed after the counter (ПП, ПР, АП, АР, КП, КР, ОП, ОР, РП, РР). Null under the same condition as transactionTypeCounter.
        totalAmount: { type: number }
        totalTax:
          type: [number, 'null']
          description: Sum of the V-PFR signed tax amounts of the document (the printed "Укупан износ пореза" before its two-decimal display rounding). Null under the same condition as transactionTypeCounter.
        verificationUrl: { type: string, format: uri }
        journal: { type: string }

    ReceiptRepresentations:
      type: object
      additionalProperties: false
      required: [textUrl, jsonUrl, pdfA4Url, pdf80mmUrl, pdf58mmUrl, previewImageUrl, qrImageUrl, verificationUrl, preferredPaperFormat]
      properties:
        textUrl: { type: string, format: uri-reference }
        jsonUrl: { type: string, format: uri-reference }
        pdfA4Url: { type: string, format: uri-reference }
        pdf80mmUrl: { type: string, format: uri-reference }
        pdf58mmUrl: { type: string, format: uri-reference }
        previewImageUrl: { type: string, format: uri-reference }
        qrImageUrl: { type: string, format: uri-reference }
        verificationUrl: { type: string, format: uri }
        preferredPaperFormat:
          type: string
          enum: [80mm, 58mm, a4]
          description: Immutable preferred print/PDF format captured when this fiscal operation was reserved.

    ReceiptCanonicalPackage:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - sourceSha256
        - canonicalRequestSha256
        - originalPfrResponseSha256
        - fiscalDocumentId
        - taxpayerId
        - businessPremiseId
        - clientReference
        - invoiceType
        - transactionType
        - request
        - pfr
        - branding
      properties:
        schemaVersion: { type: string, const: boka-receipt-representation-v27 }
        sourceSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        canonicalRequestSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        originalPfrResponseSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        fiscalDocumentId: { type: string, format: uuid }
        taxpayerId: { type: string, format: uuid }
        businessPremiseId: { type: string, format: uuid }
        clientReference: { type: string }
        invoiceType: { $ref: '#/components/schemas/InvoiceType' }
        transactionType: { $ref: '#/components/schemas/TransactionType' }
        request: { $ref: '#/components/schemas/ReceiptCanonicalRequest' }
        pfr: { $ref: '#/components/schemas/ReceiptCanonicalPfr' }
        branding:
          oneOf:
            - $ref: '#/components/schemas/ReceiptCanonicalBranding'
            - type: 'null'

    ReceiptCanonicalBranding:
      type: object
      additionalProperties: false
      required: [revisionId, contentSha256, preferredPaperFormat]
      properties:
        revisionId: { type: string, format: uuid }
        contentSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        businessPremiseId: { type: [string, 'null'], format: uuid }
        headerLogoAssetId: { type: [string, 'null'], format: uuid }
        headerLogoSha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        footerLogoAssetId: { type: [string, 'null'], format: uuid }
        footerLogoSha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        displayName: { type: [string, 'null'] }
        website: { type: [string, 'null'], format: uri }
        phone: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        thankYouSr: { type: [string, 'null'] }
        thankYouEn: { type: [string, 'null'] }
        supportSr: { type: [string, 'null'] }
        supportEn: { type: [string, 'null'] }
        preferredPaperFormat: { type: string, enum: [80mm, 58mm, a4] }

    FiscalDocumentCopyCreate:
      type: object
      additionalProperties: false
      required: [cashier]
      properties:
        cashier: { $ref: '#/components/schemas/Cashier' }
        clientReference:
          type: [string, 'null']
          maxLength: 200
          description: Defaults to COPY- followed by the original's client reference.

    ReceiptCanonicalRequest:
      type: object
      additionalProperties: false
      required: [cashierId, items, payments]
      properties:
        cashierId: { type: string }
        cashierDisplayName: { type: [string, 'null'] }
        buyer:
          oneOf:
            - $ref: '#/components/schemas/Buyer'
            - type: 'null'
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/LineItem' }
        payments:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Payment' }
        reference:
          oneOf:
            - $ref: '#/components/schemas/ReceiptCanonicalReference'
            - type: 'null'
        transactionOccurredAt: { type: [string, 'null'], format: date-time }
        commercialFooter:
          type: [string, 'null']
          maxLength: 2000
          description: Non-fiscal text rendered only outside the marked fiscal boundary.
        buyerDetails:
          description: The buyer's company-registry facts stored with the operation; printed under the buyer identification in every representation. Absent or null when none were resolved.
          oneOf:
            - $ref: '#/components/schemas/FiscalBuyerDetails'
            - type: 'null'

    FiscalBuyerDetails:
      type: object
      additionalProperties: false
      required: [legalName, taxIdentifier, source, resolvedAt]
      properties:
        legalName: { type: string, maxLength: 350 }
        taxIdentifier: { type: string, pattern: '^[0-9]{9}$' }
        registrationNumber: { type: [string, 'null'], pattern: '^[0-9]{8}$' }
        address: { type: [string, 'null'], maxLength: 300 }
        city: { type: [string, 'null'], maxLength: 100 }
        source: { type: string, enum: [nbs-jrr] }
        resolvedAt: { type: string, format: date-time }

    BuyerRegistryLookup:
      type: object
      additionalProperties: false
      required: [source, taxIdentifier, legalName, resolvedAt, fromStore]
      properties:
        source: { type: string, enum: [nbs-jrr] }
        taxIdentifier: { type: string, pattern: '^[0-9]{9}$' }
        legalName: { type: string, maxLength: 350 }
        registrationNumber: { type: [string, 'null'], pattern: '^[0-9]{8}$' }
        address: { type: [string, 'null'], maxLength: 300 }
        city: { type: [string, 'null'], maxLength: 100 }
        resolvedAt: { type: string, format: date-time }
        fromStore:
          type: boolean
          description: True when the answer came from the organization's stored registry answer (younger than 24 hours) rather than a fresh register call.

    ReceiptCanonicalReference:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source: { type: string, enum: [BOKA, EXTERNAL] }
        fiscalDocumentId: { type: [string, 'null'], format: uuid }
        pfrNumber: { type: [string, 'null'] }
        pfrTime: { type: [string, 'null'], format: date-time }

    ReceiptCanonicalPfr:
      type: object
      additionalProperties: false
      required:
        - invoiceNumber
        - sdcTime
        - requestedBy
        - signedBy
        - invoiceCounter
        - invoiceCounterExtension
        - totalCounter
        - transactionTypeCounter
        - totalAmount
        - taxGroupRevision
        - taxItems
        - businessName
        - tin
        - locationName
        - address
        - district
        - verificationUrl
        - officialJournal
        - officialJournalSha256
        - opaqueFiscalDataStored
      properties:
        invoiceNumber: { type: string }
        sdcTime: { type: string, format: date-time }
        requestedBy: { type: string }
        signedBy: { type: string }
        invoiceCounter: { type: string }
        invoiceCounterExtension: { type: string }
        totalCounter: { type: integer }
        transactionTypeCounter: { type: integer }
        totalAmount: { type: number }
        taxGroupRevision: { type: integer }
        taxItems:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ReceiptCanonicalTaxItem' }
        businessName: { type: string }
        tin: { type: string }
        locationName: { type: string }
        address: { type: string }
        district: { type: string }
        mrc: { type: [string, 'null'] }
        verificationUrl: { type: string, format: uri }
        officialJournal: { type: string }
        officialJournalSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        opaqueFiscalDataStored:
          type: boolean
          const: true
          description: Confirms presence in the hashed original response without exposing opaque values.

    ReceiptCanonicalTaxItem:
      type: object
      additionalProperties: false
      required: [categoryType, label, amount, rate, categoryName, taxableAmountPerLabel]
      properties:
        categoryType: { type: integer, minimum: 0, maximum: 2 }
        label: { type: string }
        amount: { type: number, minimum: 0 }
        rate: { type: number, minimum: 0 }
        categoryName: { type: string }
        taxableAmountPerLabel:
          type: number
          minimum: 0
          description: |
            Boka-derived, not signed by the V-PFR. The v3 Create Invoice response
            carries only label, categoryName, categoryType, rate and amount per
            tax item; the v4 protocol (deployed only in Eswatini) defines this
            field as the sum of the POS-supplied per-item taxable amounts. BokaPOS
            computes it the same way from the stored receipt lines: the gross of
            every line carrying the label, minus that label's V-PFR tax amount.
            For a single-label line this is exactly the official value; a line
            with several labels contributes its full gross to each of them.

    RefundWorkflowCreate:
      type: object
      additionalProperties: false
      required: [taxpayerId, businessPremiseId, clientReference, original, cashier, buyer, items, payments]
      properties:
        taxpayerId: { type: string, format: uuid }
        businessPremiseId: { type: string, format: uuid }
        clientReference: { type: string }
        original: { $ref: '#/components/schemas/BokaDocumentReference' }
        cashier: { $ref: '#/components/schemas/Cashier' }
        buyer: { $ref: '#/components/schemas/Buyer' }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RefundWorkflowLineItem' }
        payments:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Payment' }

    RefundWorkflowLineItem:
      type: object
      additionalProperties: false
      required: [originalLineIndex, name, quantity, unitPrice, taxLabels]
      properties:
        originalLineIndex:
          type: integer
          minimum: 0
          description: Zero-based index of the exact line on the identified original receipt.
        catalogProductId:
          type: string
          format: uuid
          description: Optional; must match the Boka-stored original line when source is BOKA.
        name: { type: string, minLength: 1, maxLength: 2048 }
        unitOfMeasure:
          type: string
          minLength: 1
          maxLength: 50
          description: "Required on every item except the codebook advance literals (10: Аванс (Ђ) and siblings), which are prescribed verbatim without a unit. The API refuses any other item without one (422, Items.UnitOfMeasure) and composes it into the signed item name as name/unit."
        quantity:
          type: number
          minimum: 0.001
          maximum: 99999999999.999
          multipleOf: 0.001
          description: Quantity returned from this original line.
        unitPrice:
          type: number
          minimum: 0
          maximum: 999999999999999999999999.99
          multipleOf: 0.01
          description: Must match the final gross unit price on the identified original line when source is BOKA.
        unitPriceBeforeDiscount:
          type: number
          minimum: 0
          maximum: 999999999999999999999999.9999
          multipleOf: 0.0001
          description: Optional Boka-local pre-discount price; when the source line has it, the value must match exactly and remain greater than unitPrice.
        gtin: { type: string, minLength: 8, maxLength: 14 }
        taxLabels:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }

    RefundWorkflow:
      type: object
      additionalProperties: false
      required:
        - id
        - taxpayerId
        - businessPremiseId
        - clientReference
        - status
        - original
        - refund
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        taxpayerId: { type: string, format: uuid }
        businessPremiseId: { type: string, format: uuid }
        clientReference: { type: string }
        status:
          type: string
          enum: [REFUND_PENDING, REFUND_OUTCOME_UNKNOWN, COPY_PENDING, COPY_OUTCOME_UNKNOWN, COMPLETED, FAILED]
        original: { $ref: '#/components/schemas/RefundWorkflowOriginal' }
        refund: { $ref: '#/components/schemas/FiscalDocument' }
        cashRefundCopy:
          oneOf:
            - $ref: '#/components/schemas/FiscalDocument'
            - type: 'null'
        failureCode: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RefundWorkflowOriginal:
      type: object
      additionalProperties: false
      required: [source, fiscalDocumentId, pfrNumber, pfrTime, invoiceType, transactionType]
      properties:
        source: { type: string, const: BOKA }
        fiscalDocumentId: { type: string, format: uuid }
        pfrNumber: { type: string }
        pfrTime: { type: string, format: date-time }
        invoiceType: { $ref: '#/components/schemas/InvoiceType' }
        transactionType: { $ref: '#/components/schemas/TransactionType' }

    ProformaTrainingWorkflowCreate:
      type: object
      additionalProperties: false
      required: [taxpayerId, businessPremiseId, clientReference, invoiceType, transactionType, cashier, items, payments]
      properties:
        taxpayerId: { type: string, format: uuid }
        businessPremiseId: { type: string, format: uuid }
        clientReference: { type: string, minLength: 1, maxLength: 200 }
        invoiceType:
          type: string
          enum: [PROFORMA, TRAINING]
        transactionType: { $ref: '#/components/schemas/TransactionType' }
        cashier: { $ref: '#/components/schemas/Cashier' }
        buyer: { $ref: '#/components/schemas/Buyer' }
        original: { $ref: '#/components/schemas/BokaDocumentReference' }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/LineItem' }
        payments:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Payment' }
        commercialFooter: { type: string, maxLength: 2000 }
        metadata:
          type: object
          additionalProperties: { type: string }
          description: Non-fiscal caller metadata.

    ProformaTrainingWorkflow:
      type: object
      additionalProperties: false
      required:
        - id
        - taxpayerId
        - businessPremiseId
        - clientReference
        - invoiceType
        - transactionType
        - state
        - document
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        taxpayerId: { type: string, format: uuid }
        businessPremiseId: { type: string, format: uuid }
        clientReference: { type: string }
        invoiceType:
          type: string
          enum: [PROFORMA, TRAINING]
        transactionType: { $ref: '#/components/schemas/TransactionType' }
        state:
          type: string
          enum: [PENDING, COMPLETED, OUTCOME_UNKNOWN, REJECTED, FAILED]
        original:
          oneOf:
            - $ref: '#/components/schemas/ProformaTrainingWorkflowOriginal'
            - type: 'null'
        document: { $ref: '#/components/schemas/FiscalDocument' }
        failureCode: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProformaTrainingWorkflowOriginal:
      type: object
      additionalProperties: false
      required: [source, fiscalDocumentId, pfrNumber, pfrTime, invoiceType, transactionType]
      properties:
        source: { type: string, const: BOKA }
        fiscalDocumentId: { type: string, format: uuid }
        pfrNumber: { type: string }
        pfrTime: { type: string, format: date-time }
        invoiceType:
          type: string
          enum: [PROFORMA, TRAINING]
        transactionType: { $ref: '#/components/schemas/TransactionType' }

    ProformaTrainingWorkflowConflict:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string }
        workflowId: { type: string, format: uuid }
        sourceFiscalDocumentId: { type: string, format: uuid }

    FiscalUnavailableError:
      type: object
      additionalProperties: false
      required: [code, fiscalized]
      properties:
        code: { type: string }
        fiscalized: { type: boolean, const: false }

    AdvanceCaseCreate:
      type: object
      additionalProperties: false
      required: [taxpayerId, businessPremiseId, clientReference]
      properties:
        taxpayerId: { type: string, format: uuid }
        businessPremiseId: { type: string, format: uuid }
        clientReference: { type: string, minLength: 1, maxLength: 200 }
        externalAdvance:
          oneOf:
            - $ref: '#/components/schemas/ExternalAdvance'
            - type: 'null'
          description: |
            Advances collected before eFiscalization that this case closes. The
            first Advance Sale then references the last pre-fiscal document as
            XXXXXXXX-XXXXXXXX-<number>, or the close starts with the Advance
            Refund referencing it when no Advance Sale was fiscalized, and the
            closing Advance Refund sums pre-fiscal and fiscal advances alike.

    ExternalAdvance:
      type: object
      additionalProperties: false
      required: [amount, taxLabel, paymentType, lastDocumentNumber, lastDocumentTime]
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.01
          description: Sum of every advance collected before eFiscalization; at most two decimals.
        taxLabel:
          type: string
          description: Tax label of the future supply; must be a prescribed advance label.
        paymentType: { $ref: '#/components/schemas/PaymentType' }
        lastDocumentNumber:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[0-9]{1,20}$'
          description: |
            Number of the last pre-fiscal advance document, digits only (1 to 20). It is sent as the
            `<number>` part of the reference `XXXXXXXX-XXXXXXXX-<number>`; the official examples are
            `17`, `121` and `159`, and the V-PFR rejects any other form. Anything but digits returns
            422 with the `ExternalAdvance.LastDocumentNumber` validation key.
        lastDocumentTime:
          type: string
          format: date-time
          description: Issue date of that document; must precede the request.

    AdvanceCancellationCreate:
      type: object
      additionalProperties: false
      required: [cashier, advanceSaleFiscalDocumentId]
      properties:
        cashier: { $ref: '#/components/schemas/Cashier' }
        advanceSaleFiscalDocumentId:
          type: string
          format: uuid
          description: The latest fiscalized Advance Sale of the open case; nothing else can be cancelled.

    AdvancePaymentCreate:
      type: object
      additionalProperties: false
      required: [cashier, items, payments, commercialFooter]
      properties:
        cashier: { $ref: '#/components/schemas/Cashier' }
        buyer: { $ref: '#/components/schemas/Buyer' }
        paymentOccurredAt:
          type: string
          format: date-time
          description: |
            Actual earlier payment time for the documented wire-transfer case.
            When supplied, it must precede the fiscalization attempt and at
            least one payment must be Wire Transfer.
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/LineItem' }
        payments:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Payment' }
        commercialFooter:
          type: string
          minLength: 1
          maxLength: 2000
          description: Mandatory non-fiscal commercial area for the Advance Sale.

    AdvanceCaseClose:
      type: object
      additionalProperties: false
      required: [cashier, finalItems, remainingPayments]
      properties:
        cashier: { $ref: '#/components/schemas/Cashier' }
        buyer: { $ref: '#/components/schemas/Buyer' }
        finalItems:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/LineItem' }
        remainingPayments:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Payment' }
          description: |
            Must equal the final amount less the stored advance amount. Supply
            one explicit zero-amount element when the remaining balance is zero,
            because Create Invoice requires at least one payment element.
        commercialFooter: { type: string, maxLength: 1500 }

    AdvanceCase:
      type: object
      additionalProperties: false
      required: [id, taxpayerId, businessPremiseId, clientReference, state, advanceSales, cancellations, cancelledAdvanceSaleIds, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        taxpayerId: { type: string, format: uuid }
        businessPremiseId: { type: string, format: uuid }
        clientReference: { type: string }
        externalAdvance:
          oneOf:
            - $ref: '#/components/schemas/ExternalAdvance'
            - type: 'null'
        state:
          type: string
          enum:
            - OPEN
            - ADVANCE_SALE_OUTCOME_UNKNOWN
            - CLOSING
            - ADVANCE_REFUND_OUTCOME_UNKNOWN
            - ADVANCE_REFUND_FISCALIZED_SALE_PENDING
            - FINAL_SALE_OUTCOME_UNKNOWN
            - CLOSED
            - FAILED
        advanceSales:
          type: array
          items: { $ref: '#/components/schemas/FiscalDocument' }
        cancellations:
          type: array
          description: Standalone Advance Refunds that cancelled an erroneous Advance Sale of this case, in issue order.
          items: { $ref: '#/components/schemas/FiscalDocument' }
        cancelledAdvanceSaleIds:
          type: array
          description: |
            Ids of the Advance Sales in `advanceSales` that a fiscalized cancellation removed from the
            chain. The remaining fiscalized Advance Sales are the effective chain: they are what the
            next Advance Sale references, what a closure refunds, and what the next cancellation targets.
          items: { type: string, format: uuid }
        advanceRefund:
          oneOf:
            - $ref: '#/components/schemas/FiscalDocument'
            - type: 'null'
        finalSale:
          oneOf:
            - $ref: '#/components/schemas/FiscalDocument'
            - type: 'null'
        failureCode: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AdvanceCasePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdvanceCase' }

    AdvanceCloseResult:
      type: object
      additionalProperties: false
      required: [case]
      properties:
        case: { $ref: '#/components/schemas/AdvanceCase' }

    ReceiptDeliveryLanguage:
      type: string
      enum: [sr-Cyrl, sr-Latn, en]
      description: Language of the message; the receipt itself is the official journal rendered into the attached PDFs.

    ReceiptDeliveryAttachment:
      type: string
      enum: [a4, 80mm, 58mm, png]
      description: A PDF representation attached to the message. The official verification link is always in the message; attachments are convenience copies.

    ReceiptDeliveryAttachments:
      type: array
      items: { $ref: '#/components/schemas/ReceiptDeliveryAttachment' }
      maxItems: 4
      uniqueItems: true
      description: Returned in canonical order (a4, 80mm, 58mm, png). An empty list sends the link only.

    ReceiptDeliveryCreate:
      type: object
      additionalProperties: false
      required: [fiscalDocumentId, channel, recipient]
      properties:
        fiscalDocumentId: { type: string, format: uuid }
        channel: { type: string, const: EMAIL }
        recipient: { type: string, format: email, maxLength: 320 }
        language:
          oneOf:
            - $ref: '#/components/schemas/ReceiptDeliveryLanguage'
            - type: 'null'
          description: Defaults to the taxpayer's setting.
        attachments:
          oneOf:
            - $ref: '#/components/schemas/ReceiptDeliveryAttachments'
            - type: 'null'
          description: Defaults to the taxpayer's setting.

    ReceiptDelivery:
      type: object
      additionalProperties: false
      required: [id, fiscalDocumentId, channel, recipient, language, attachments, status, attempts, failureCode, createdAt, deliveredAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        fiscalDocumentId: { type: string, format: uuid }
        channel: { type: string, const: EMAIL }
        recipient: { type: string }
        language: { $ref: '#/components/schemas/ReceiptDeliveryLanguage' }
        attachments: { $ref: '#/components/schemas/ReceiptDeliveryAttachments' }
        status: { type: string, enum: [QUEUED, SENDING, DELIVERED, FAILED] }
        attempts: { type: integer, minimum: 0 }
        failureCode: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        deliveredAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: string, format: date-time }

    ReceiptDeliveryPremiseSenderName:
      type: object
      additionalProperties: false
      required: [businessPremiseId, senderDisplayName]
      properties:
        businessPremiseId: { type: string, format: uuid }
        senderDisplayName: { type: string, maxLength: 120 }

    ReceiptDeliverySettingsWrite:
      type: object
      additionalProperties: false
      description: |
        The E-mail receipts module customization. Templates accept the
        placeholders {receiptNumber}, {kind}, {total}, {issuer}, {premise} and
        {date}; Serbian templates serve both scripts. The official verification
        link and the legal line are always in the message and cannot be
        templated away. The platform mailbox stays the From address; the sender
        display name is the issuer's name shown to the customer.
      required: [mode, language]
      properties:
        mode:
          type: string
          enum: [disabled, email]
          description: disabled means the taxpayer delivers receipts through its own system.
        language: { $ref: '#/components/schemas/ReceiptDeliveryLanguage' }
        attachments:
          oneOf:
            - $ref: '#/components/schemas/ReceiptDeliveryAttachments'
            - type: 'null'
          description: Omitted or null means the default, a4 and 80mm; an empty list means no attachments.
        senderDisplayName: { type: [string, 'null'], maxLength: 120 }
        replyToAddress: { type: [string, 'null'], maxLength: 320 }
        internalCopyAddress:
          type: [string, 'null']
          maxLength: 320
          description: Receives a blind copy of every receipt e-mail; never used for test messages.
        includeQrCode: { type: boolean, default: false }
        subjectSr: { type: [string, 'null'], maxLength: 200 }
        subjectEn: { type: [string, 'null'], maxLength: 200 }
        introSr: { type: [string, 'null'], maxLength: 2000 }
        introEn: { type: [string, 'null'], maxLength: 2000 }
        footerSr: { type: [string, 'null'], maxLength: 1000 }
        footerEn: { type: [string, 'null'], maxLength: 1000 }
        premiseSenderNames:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/ReceiptDeliveryPremiseSenderName' }

    ReceiptDeliverySettings:
      type: object
      additionalProperties: false
      required: [taxpayerId, mode, language, attachments, configured, updatedAt, senderDisplayName, replyToAddress, internalCopyAddress, includeQrCode, subjectSr, subjectEn, introSr, introEn, footerSr, footerEn, premiseSenderNames, placeholders, defaultTemplates]
      properties:
        taxpayerId: { type: string, format: uuid }
        mode: { type: string, enum: [disabled, email] }
        language: { $ref: '#/components/schemas/ReceiptDeliveryLanguage' }
        attachments: { $ref: '#/components/schemas/ReceiptDeliveryAttachments' }
        configured:
          type: boolean
          description: false when no settings row exists yet (the defaults above apply).
        updatedAt: { type: [string, 'null'], format: date-time }
        senderDisplayName: { type: [string, 'null'] }
        replyToAddress: { type: [string, 'null'] }
        internalCopyAddress: { type: [string, 'null'] }
        includeQrCode: { type: boolean }
        subjectSr: { type: [string, 'null'] }
        subjectEn: { type: [string, 'null'] }
        introSr: { type: [string, 'null'] }
        introEn: { type: [string, 'null'] }
        footerSr: { type: [string, 'null'] }
        footerEn: { type: [string, 'null'] }
        premiseSenderNames:
          type: array
          items: { $ref: '#/components/schemas/ReceiptDeliveryPremiseSenderName' }
        placeholders:
          type: array
          items: { type: string }
          description: The placeholders the templates accept.
        defaultTemplates:
          type: object
          additionalProperties: false
          description: The built-in text per language, used when a stored template is empty; every placeholder appears in it.
          required: [subjectSr, introSr, footerSr, subjectEn, introEn, footerEn]
          properties:
            subjectSr: { type: string }
            introSr: { type: string }
            footerSr: { type: string }
            subjectEn: { type: string }
            introEn: { type: string }
            footerEn: { type: string }

    ReceiptDeliveryPreviewRequest:
