  /v1/security-element-upload-sessions:
    post:
      tags: [Security elements]
      operationId: createSecurityElementUploadSession
      x-boka-implementation: implemented
      summary: Create a one-time encrypted certificate onboarding session
      description: |
        Used by both customer self-service and BOKA-assisted onboarding.
        The resulting upload cannot be used to retrieve plaintext secrets.

        The binding to a taxpayer and business premise is optional. When
        `taxpayerId` and `businessPremiseId` are omitted (customer
        self-service), the binding is resolved from the uploaded certificate
        on completion: the certificate's TaxCore extensions name the taxpayer
        PIB and the fiscal environment, and its subject names the premise
        code (`OU`), the taxpayer name (`O`) and the premise address. A
        taxpayer or premise that does not exist yet in the organization and
        environment is created at that point; an existing one is reused when
        its PIB, or its PU identifier compared without regard to case and
        surrounding or repeated whitespace, matches. A machine credential may
        open such a session only in its own environment
        (422 `CREDENTIAL_ENVIRONMENT_MISMATCH`).

        When both IDs are supplied (controlled integrations), the behaviour is
        unchanged: the premise must belong to the taxpayer and to the
        session's environment; a production certificate can never be bound to
        the BOKA sandbox premise (422 `PREMISE_ENVIRONMENT_MISMATCH`).
        Supplying only one of the two IDs is a validation error.
      security:
        - oauth2: [security-elements:write]
        - humanOidc: [security-elements:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [environment]
              properties:
                taxpayerId:
                  type: string
                  format: uuid
                  description: Optional; supplied together with businessPremiseId, or omitted so the binding comes from the certificate.
                businessPremiseId:
                  type: string
                  format: uuid
                  description: Optional; supplied together with taxpayerId.
                environment: { $ref: '#/components/schemas/FiscalEnvironment' }
      responses:
        '201':
          description: One-time upload session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityElementUploadSession'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/SecurityElementCustodyUnavailable'

  /v1/security-element-upload-sessions/{uploadSessionId}/complete:
    post:
      tags: [Security elements]
      operationId: completeSecurityElementUploadSession
      x-boka-implementation: implemented
      summary: Consume a one-time session with a compact JWE payload
      description: |
        Encrypt the complete SecurityElementUploadPayload as compact JWE using
        RSA-OAEP-256 and A256GCM with the key returned when the session was created.
        Customer self-service sends the original supplier ZIP as archiveBase64;
        direct pfxBase64 remains available for controlled integrations. Exactly
        one certificate-material field is permitted.

        The JID is read from the certificate subject `serialNumber`. A `jid`
        in the payload is optional; when present it must equal the
        certificate's value (422 `CERTIFICATE_JID_MISMATCH`). A certificate
        whose subject carries no usable identifier needs the payload `jid`
        (422 `CERTIFICATE_JID_MISSING`).

        On a session created without `taxpayerId` and `businessPremiseId`,
        the taxpayer is found by the PIB in the certificate and the premise by
        the premise code in the certificate subject, inside the session's
        environment; missing records are created (the taxpayer prefilled from
        the company registry when it answers, otherwise from the certificate
        subject; the premise as a distance-commerce premise named after the
        part of the code following the first hyphen). The certificate must
        carry the TaxCore extensions (422 `CERTIFICATE_PROFILE_INVALID`),
        name the session's environment (422 `CERTIFICATE_ENVIRONMENT_MISMATCH`)
        and name the premise and, when the registry has no entry, the
        taxpayer (422 `CERTIFICATE_SUBJECT_INCOMPLETE`). A premise cannot be
        created for an inactive taxpayer (409 `TAXPAYER_INACTIVE`). The
        response then carries `onboarding` with the safe names of the records
        the element was bound to and whether each was created.

        The session is single-use. A structurally valid certificate remains
        PENDING_VERIFICATION until the V-PFR sandbox verification succeeds.
      security:
        - oauth2: [security-elements:write]
        - humanOidc: [security-elements:write]
      parameters:
        - name: uploadSessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [encryptedPayload]
              properties:
                encryptedPayload:
                  type: string
                  description: Compact JWE containing SecurityElementUploadPayload JSON.
      responses:
        '201':
          description: Security element accepted for later V-PFR verification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecurityElement' }
        '409':
          description: Session already consumed or certificate already onboarded
        '410':
          description: Session expired or its ephemeral encryption key is no longer available
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/SecurityElementCustodyUnavailable'

