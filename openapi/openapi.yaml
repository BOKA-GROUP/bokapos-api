              schema: { $ref: "#/components/schemas/SefDemoSubmission" }
        '400':
          description: Invalid request or representation
        '401':
          description: Authentication required
        '403':
          description: Active Root required; support contexts refused
        '404':
          description: Demo document, operation or verified representation not found
    post:
      tags: [Billing]
      summary: Submit one approved isolated demo UBL invoice after a fresh SEF registration check
      operationId: submitSefDemoInvoice
      security:
        - humanOidc: []
      x-boka-implementation: implemented
      description: Active Root only; customer actors and support contexts are refused. Demo evidence never publishes a production invoice or records a payment.
      parameters:
        - in: path
          name: draftId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceDraftApproval" }
      responses:
        '200':
          description: Stored operation; repeats perform no supplier POST. Missing or ambiguous import identity is outcome_unknown and never retryable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SefDemoSubmission" }
        '201':
          description: Stored operation; repeats perform no supplier POST. Missing or ambiguous import identity is outcome_unknown and never retryable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SefDemoSubmission" }
        '400':
          description: Invalid request or representation
        '401':
          description: Authentication required
        '403':
          description: Active Root required; support contexts refused
        '404':
          description: Demo document, operation or verified representation not found
        '409':
          description: Exact approval, current customer, today's issue date, isolated allowed demo buyer and supported private-sector facts required; confirmed non-SEF buyers are refused. Unknown import outcomes cannot be refreshed or resubmitted.
        '503':
          description: SEF_DEMO_DISABLED or SEF_REGISTRATION_UNKNOWN; Development and both explicit demo flags required. Lookup failures never imply non-SEF registration.
  /v1/staff-invoices/{draftId}/sef-demo-submission/refresh:
    post:
      tags: [Billing]
      summary: Retrieve existing SEF metadata XML and PDF with GET requests only
      operationId: refreshSefDemoInvoice
      security:
        - humanOidc: []
      x-boka-implementation: implemented
      description: Active Root only; customer actors and support contexts are refused. Demo evidence never publishes a production invoice or records a payment.
      parameters:
        - in: path
          name: draftId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Stored operation; repeats perform no supplier POST. Missing or ambiguous import identity is outcome_unknown and never retryable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SefDemoSubmission" }
        '400':
          description: Invalid request or representation
        '401':
          description: Authentication required
        '403':
          description: Active Root required; support contexts refused
        '404':
          description: Demo document, operation or verified representation not found
        '409':
          description: Exact approval, current customer, today's issue date, isolated allowed demo buyer and supported private-sector facts required; confirmed non-SEF buyers are refused. Unknown import outcomes cannot be refreshed or resubmitted.
        '503':
          description: SEF_DEMO_DISABLED or SEF_REGISTRATION_UNKNOWN; Development and both explicit demo flags required. Lookup failures never imply non-SEF registration.
  /v1/staff-invoices/{draftId}/sef-demo-submission/file:
    get:
      tags: [Billing]
      summary: Download a verified demo supplier XML or PDF
      operationId: getSefDemoFile
      security:
        - humanOidc: []
      x-boka-implementation: implemented
      description: Active Root only; customer actors and support contexts are refused. Demo evidence never publishes a production invoice or records a payment.
      parameters:
        - in: path
          name: draftId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: format
          required: true
          schema: { type: string, enum: [xml, pdf] }
      responses:
        '200':
          description: Exact verified supplier representation with private no-store caching and attachment disposition.
          content:
            application/xml:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        '400':
          description: Invalid request or representation
        '401':
          description: Authentication required
        '403':
          description: Active Root required; support contexts refused
        '404':
          description: Demo document, operation or verified representation not found
  /v1/billing/documents:
    get:
      tags: [Billing]
      summary: Owner reads only published production invoice documents for their organization
      operationId: invoiceDocument4
      x-boka-implementation: implemented
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
      responses:
        '200':
          description: Owner reads only published production invoice documents for their organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceDocumentPage" }
        '400':
          description: Malformed request
        '401':
          description: Authentication required
        '403':
          description: Active Root or exact customer Owner required; support contexts refused
        '404':
          description: Document not found in authorized scope
        '409':
          description: Draft changed, unapproved, already reserved, unsupported content, stale customer or wrong issue date
  /v1/billing/documents/{documentId}/pdf:
    get:
      tags: [Billing]
      summary: Owner downloads a published production invoice PDF for their organization
      operationId: invoiceDocument5
      x-boka-implementation: implemented
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Owner downloads a published production invoice PDF for their organization
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '400':
          description: Malformed request
        '401':
          description: Authentication required
        '403':
          description: Active Root or exact customer Owner required; support contexts refused
        '404':
          description: Document not found in authorized scope
        '409':
          description: Draft changed, unapproved, already reserved, unsupported content, stale customer or wrong issue date

components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.bokapos.rs/realms/boka/protocol/openid-connect/token
          scopes:
            fiscal:read: Read fiscal documents and receipt representations
            fiscal:write: Fiscalize standalone documents
            refund:write: Create refund workflows
            proforma-training:write: Create bounded Proforma and Training workflows
            advance:write: Create advance cases and payments
            advance:close: Close an advance case
            delivery:write: Deliver receipts electronically
            operations:read: Read operation status
            catalogue:read: Read catalogue products
            catalogue:write: Change catalogue products
            configuration:read: Read fiscal configuration
            tenant:read: Read granted taxpayers and premises
            tenant:write: Administer taxpayers and premises
            security-elements:read: Read safe V-PFR security-element metadata
            security-elements:write: Onboard or rotate V-PFR security elements
    humanOidc:
      type: oauth2
      description: Confidential BFF authorization-code flow. Human claims are intersected with active persisted memberships.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.bokapos.rs/realms/boka/protocol/openid-connect/auth
          tokenUrl: https://auth.bokapos.rs/realms/boka/protocol/openid-connect/token
          scopes:
            tenant:read: Read the exact customer tenant or an explicitly validated staff support context
            tenant:write: Administer taxpayers and premises within the authorized tenant
            catalogue:read: Read customer catalogue data within the exact authorized tenant context
            catalogue:write: Change customer catalogue products within the authorized tenant
            operations:read: Read durable fiscal-operation status within the authorized tenant
            fiscal:read: Read fiscal documents and receipt representations within the authorized tenant
            fiscal:write: Fiscalize documents within the authorized tenant
            refund:write: Create refund workflows within the authorized tenant
            advance:write: Create Advance cases and fiscalize their Advance Sales within the authorized tenant
            advance:close: Close Advance cases through the server-owned Refund and final Sale chain
            configuration:read: Read freshly fetched PFR tax configuration within the authorized tenant
            security-elements:read: Read safe V-PFR security-element metadata within the authorized tenant
            ai-connections:write: Create, change and remove AI connections; the MCP gateway's consent sign-in carries this instead of tenant:write
            security-elements:write: Onboard, suspend, or retire V-PFR security elements within the authorized tenant
            memberships:read: Read organization membership metadata
            memberships:write: Invite or change non-Owner organization members
            staff:read: Read BOKA staff membership metadata
            staff:write: Invite or change BOKA staff within the actor's authority
            customers:read: Read safe BOKA customer-provisioning state
            customers:write: Provision BOKA customer organizations and pending Owners
            support-contexts:read: Read support contexts owned by the exact staff identity
            support-contexts:write: Open or close short-lived staff support contexts

  parameters:
    BillingPeriodKey:
      name: period
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
      description: Belgrade calendar month, YYYY-MM; year 2000 through 2999.
    StaffLicenseOrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CompanyRegistryTaxIdentifier:
      name: taxIdentifier
      in: query
      required: false
      description: Nine-digit Serbian PIB. Exactly one of taxIdentifier or registrationNumber is required.
      schema: { type: string, pattern: '^[0-9]{9}$' }
    CompanyRegistryRegistrationNumber:
      name: registrationNumber
      in: query
      required: false
      description: Eight-digit Serbian registration number (matični broj). Exactly one of taxIdentifier or registrationNumber is required.
      schema: { type: string, pattern: '^[0-9]{8}$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique within the applicable tenant or control-plane operation; reuse only for the same canonical command.
      schema: { type: string, minLength: 16, maxLength: 200 }
    FiscalDocumentId:
      name: fiscalDocumentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReceiptRepresentationFormat:
      name: representationFormat
      in: path
      required: true
      schema:
        type: string
        enum: [canonical-json, official-text, qr-svg, pdf-a4, pdf-80mm, pdf-58mm, preview-png]
    AdvanceCaseId:
      name: advanceCaseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProformaTrainingWorkflowId:
      name: proformaTrainingWorkflowId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SecurityElementId:
      name: securityElementId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StaffSandboxElementId:
      name: staffSandboxElementId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StaffSecurityElementId:
      name: staffSecurityElementId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OperationId:
      name: operationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaxpayerId:
      name: taxpayerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BusinessPremiseId:
      name: businessPremiseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrganizationMemberId:
      name: organizationMemberId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StaffMemberId:
      name: staffMemberId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SupportContextId:
      name: supportContextId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StaffSupportContextHeader:
      name: Boka-Support-Context
      in: header
      required: false
      description: Exact active staff support-context ID, always revalidated against the signed staff identity. A `customer-support-read` context is valid only for the allowlisted GET routes; a `customer-data-edit` context (Senior Operations or Root) additionally permits the taxpayer, business-premise and catalogue writes that declare this parameter.
      schema: { type: string, format: uuid }
    CustomerProvisioningId:
      name: customerProvisioningId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaxpayerFilter:
      name: taxpayerId
      in: query
      required: false
      schema: { type: string, format: uuid }
    PremiseFilter:
      name: businessPremiseId
      in: query
      required: false
      schema: { type: string, format: uuid }
    FiscalDocumentFilter:
      name: fiscalDocumentId
      in: query
      schema: { type: string, format: uuid }
    FiscalDocumentStatusFilter:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/FiscalDocumentStatus' }
    InvoiceTypeFilter:
      name: invoiceType
      in: query
      schema: { $ref: '#/components/schemas/InvoiceType' }
    TransactionTypeFilter:
      name: transactionType
      in: query
      schema: { $ref: '#/components/schemas/TransactionType' }
    CreatedFromFilter:
      name: createdFrom
      in: query
      description: Inclusive lower bound for durable operation creation time. Any RFC 3339 offset is accepted (Z, +00:00, +02:00) and compared as an instant.
      schema: { type: string, format: date-time }
    CreatedToFilter:
      name: createdTo
      in: query
      description: Exclusive upper bound for durable operation creation time. Any RFC 3339 offset is accepted and compared as an instant.
      schema: { type: string, format: date-time }
    PfrFromFilter:
      name: pfrFrom
      in: query
      description: Inclusive lower bound for authoritative PFR signing time; excludes entries with no PFR receipt. Any RFC 3339 offset is accepted and compared as an instant.
      schema: { type: string, format: date-time }
    PfrToFilter:
      name: pfrTo
      in: query
      description: Exclusive upper bound for authoritative PFR signing time; excludes entries with no PFR receipt. Any RFC 3339 offset is accepted and compared as an instant.
      schema: { type: string, format: date-time }
    IdempotencyKeyFilter:
      name: idempotencyKey
      in: query
      schema: { type: string, maxLength: 200 }
    ClientReferenceFilter:
      name: clientReference
      in: query
      schema: { type: string, maxLength: 200 }
    PfrNumberFilter:
      name: pfrNumber
      in: query
      schema: { type: string, maxLength: 500 }
    CashierIdFilter:
      name: cashierId
      in: query
      schema: { type: string, maxLength: 500 }
    BuyerIdFilter:
      name: buyerId
      in: query
      schema: { type: string, maxLength: 500 }
    FiscalDocumentSearch:
      name: search
      in: query
      description: Case-insensitive contains search across safe identifiers only; raw PFR payload, journal, metadata, and secrets are excluded.
      schema: { type: string, maxLength: 200 }
    FiscalDocumentCursor:
      name: cursor
      in: query
      description: Opaque keyset cursor returned by the preceding journal page.
      schema: { type: string, maxLength: 200 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, format: uuid }
    HumanAccessAuditCursor:
      name: cursor
      in: query
      description: Opaque keyset cursor returned by the preceding audit page.
      schema: { type: string, maxLength: 200 }
    OrganizationAuditCursor:
      name: cursor
      in: query
      description: Opaque keyset cursor returned by the preceding organization audit page.
      schema: { type: string, maxLength: 200 }
    OrganizationAuditPageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    IdempotencyConflict:
      description: The key was already used with different canonical content
      content:
        application/json:
          schema: { $ref: '#/components/schemas/IdempotencyConflict' }
    ResourceConflict:
      description: The requested resource conflicts with an existing tenant-scoped record
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Conflict' }
    ValidationError:
      description: The command violates a Boka or fiscal rule
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
        application/json:
          schema: { $ref: '#/components/schemas/ErrorCode' }
    PfrUnavailable:
      description: No fiscal receipt was issued because V-PFR was unavailable or its outcome requires reconciliation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FiscalDocument' }
    SecurityElementCustodyUnavailable:
      description: Security-element custody is disabled, unavailable, or cannot safely use the required key version
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorCode' }
    NotFound:
      description: Resource does not exist within the authenticated tenant scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorCode' }

  schemas:
    ProductionInvoiceWrite:
      type: object
      additionalProperties: false
      required: [expectedVersion, expectedSha256, taxProfileId, taxProfileSha256, route, numberRegistryReference, confirmBuyerNotRequiredOnSef, confirmIssue]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        expectedSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        taxProfileId: { type: string, format: uuid }
        taxProfileSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        route: { type: string, enum: [sef, ordinary] }
        numberRegistryReference: { type: string, minLength: 1, maxLength: 256, description: Root reference to the completed reconciliation with all external numbering sources; never include credentials }
        confirmBuyerNotRequiredOnSef: { type: boolean, description: Must be true for ordinary and false for SEF; transaction eligibility is independently rechecked }
        confirmIssue: { type: boolean, enum: [true] }
    ProductionInvoice:
      type: object
      required: [draftId, documentId, invoiceNumber, route, issuanceState, vatState, providerId, verificationState, externalStatus, productionEnabled, retryAllowed]
      properties:
        draftId: { type: string, format: uuid }
        documentId: { type: string, format: uuid, nullable: true }
        invoiceNumber: { type: string, nullable: true }
        route: { type: string, nullable: true, enum: [sef, ordinary, null] }
        issuanceState: { type: string, enum: [not_started, outcome_unknown, submitted, issued] }
        vatState: { type: string, nullable: true, enum: [outcome_unknown, submitted, verified, null] }
        providerId: { type: integer, format: int64, nullable: true, description: SEF salesInvoiceId or individualVatId according to route; never proof of bank payment }
        verificationState: { type: string, nullable: true, enum: [verified, pdf_pending, facts_mismatch, readback_failed, null] }
        externalStatus: { type: string, nullable: true }
        productionEnabled: { type: boolean }
        retryAllowed: { type: boolean, enum: [false] }
    InvoiceIssuerTaxProfileWrite:
      type: object
      additionalProperties: false
      required: [expectedVersion, effectiveFrom, enabled, monthlyServicesConfirmed, confirmProfile]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        effectiveFrom: { type: string, format: date }
        enabled: { type: boolean }
        monthlyServicesConfirmed: { type: boolean }
        confirmProfile: { type: boolean, enum: [true] }
    InvoiceIssuerTaxProfile:
      type: object
      required: [id, version, effectiveFrom, enabled, monthlyServicesConfirmed, vatPayer, vatPeriod, accounting, vatRate, contentSha256, recordedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 1 }
        effectiveFrom: { type: string, format: date }
        enabled: { type: boolean }
        monthlyServicesConfirmed: { type: boolean }
        vatPayer: { type: boolean, enum: [true] }
        vatPeriod: { type: string, enum: [monthly] }
        accounting: { type: string, enum: [ordinary] }
        vatRate: { type: number, enum: [0.2] }
        contentSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        recordedAt: { type: string, format: date-time }
    InvoiceIssuerTaxProfilePage:
      type: object
      required: [items, page, hasMore]
      properties:
        items:
          type: array
          maxItems: 24
          items: { $ref: '#/components/schemas/InvoiceIssuerTaxProfile' }
        page: { type: integer }
        hasMore: { type: boolean }
    InvoiceReadiness:
      type: object
      required: [draftId, draftVersion, draftSha256, checkedAt, supplyOn, taxPeriod, taxProfile, localBlockers, productionEnabled, canIssue, route, delivery, productionBlockers]
      properties:
        draftId: { type: string, format: uuid }
        draftVersion: { type: integer, format: int64 }
        draftSha256: { type: string }
        checkedAt: { type: string, format: date-time }
        supplyOn: { type: string, format: date }
        taxPeriod: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        taxProfile:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/InvoiceIssuerTaxProfile'
        localBlockers:
          type: array
          items: { type: string }
        productionEnabled: { type: boolean }
        canIssue: { type: boolean, enum: [false] }
        route: { type: string, enum: [unresolved] }
        delivery: { type: string, enum: [owner_email_confirmed, account_review_required] }
        productionBlockers:
          type: array
          items: { type: string }
    MonthlyInvoicePolicyWrite:
      type: object
      additionalProperties: false
      required: [expectedVersion, customerVersion, enabled, firstPeriod, paymentCode, confirmMonthlyApproval]
      properties:
        issueAndSend: { type: boolean, default: false, description: Also authorize automatic production issuance and original PDF email. Existing policies remain preparation-only. }
        allowOrdinary: { type: boolean, default: false, description: Explicit non-SEF ordinary-invoice eligibility. Registration is freshly rechecked before each individual VAT dispatch. }
        numberRegistryReference: { type: string, nullable: true, maxLength: 256 }
        confirmIssueAndSend: { type: boolean, default: false, description: Required true when enabling full automatic issuance and sending. }

        expectedVersion: { type: integer, format: int64, minimum: 0 }
        customerVersion: { type: integer, format: int64, minimum: 1 }
        enabled: { type: boolean }
        firstPeriod: { type: string, description: Current or future service month for a new policy; unchanged earlier start may be retained on review. }
        paymentCode: { type: string, enum: ['220', '221'] }
        confirmMonthlyApproval: { type: boolean, description: Required true when enabling. Authorizes exact monthly draft approval from recorded terms, not missing opening history or production dispatch. }
    MonthlyInvoiceRecheck:
      type: object
      additionalProperties: false
      required: [expectedPolicyVersion, expectedAttempt, confirmPreparation]
      properties:
        expectedPolicyVersion: { type: integer, format: int64, minimum: 1 }
        expectedAttempt: { type: integer, format: int64, minimum: 0 }
        confirmPreparation: { type: boolean, enum: [true], description: Explicit Root review, including late preparation with today's date. }
    MonthlyInvoicePolicy:
      type: object
      required: [customerId, version, enabled, firstPeriod, customerVersion, paymentCode, workerEnabled, issuanceEnabled, blockingReason, updatedAt, issueAndSend, allowOrdinary, numberRegistryReference]
      properties:
        issueAndSend: { type: boolean }
        allowOrdinary: { type: boolean }
        numberRegistryReference: { type: string, nullable: true, maxLength: 256 }

        customerId: { type: string, format: uuid }
        version: { type: integer, format: int64 }
        enabled: { type: boolean }
        firstPeriod: { type: string, nullable: true }
        customerVersion: { type: integer, format: int64 }
        paymentCode: { type: string, enum: ['220', '221'] }
        workerEnabled: { type: boolean }
        issuanceEnabled: { type: boolean, description: All global production and automatic-delivery gates enabled; each customer still needs issueAndSend authority. }
        blockingReason: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
    MonthlyInvoiceRun:
      type: object
      required: [id, period, attempt, policyVersion, state, reason, closedPeriodId, draftId, draftVersion, draftSha256, recordedAt, canRecheck]
      properties:
        id: { type: string, format: uuid }
        period: { type: string }
        attempt: { type: integer, format: int64 }
        policyVersion: { type: integer, format: int64 }
        state: { type: string, enum: [needs_review, approved_awaiting_issuance, settled_without_invoice, existing_draft, issued_and_sent] }
        reason: { type: string, nullable: true }
        closedPeriodId: { type: string, format: uuid, nullable: true }
        draftId: { type: string, format: uuid, nullable: true }
        draftVersion: { type: integer, format: int64, nullable: true }
        draftSha256: { type: string, nullable: true }
        recordedAt: { type: string, format: date-time }
        canRecheck: { type: boolean, description: Saved attention may be rechecked by Root; a changed previously approved draft requires explicit manual review. }
    MonthlyInvoiceToggle:
      type: object
      additionalProperties: false
      required: [expectedVersion, enabled]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        enabled: { type: boolean }
    InvoicingDefaultsWrite:
      type: object
      additionalProperties: false
      required: [expectedVersion, numberRegistryReference, allowOrdinary, paymentCode, confirmDefaults]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        numberRegistryReference: { type: string, minLength: 1, maxLength: 256 }
        allowOrdinary: { type: boolean, description: Ordinary-invoice and individual-VAT eligibility when the fresh lookup shows the buyer absent from SEF. }
        paymentCode: { type: string, enum: ['220', '221'] }
        confirmDefaults: { type: boolean, enum: [true] }
    InvoicingDefaults:
      type: object
      required: [version, numberRegistryReference, allowOrdinary, paymentCode, recordedAt, configured, blockingReason]
      properties:
        version: { type: integer, format: int64, description: 0 when no version exists; the suggested values are then returned. }
        numberRegistryReference: { type: string }
        allowOrdinary: { type: boolean }
        paymentCode: { type: string, enum: ['220', '221'] }
        recordedAt: { type: string, format: date-time, nullable: true }
