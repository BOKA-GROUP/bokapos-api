  /v1/customer-provisionings/{customerProvisioningId}/resend-invitation:
    post:
      tags: [BOKA control plane]
      operationId: resendCustomerProvisioningInvitation
      x-boka-implementation: implemented
      summary: Authorize one explicit re-dispatch of a pending Owner invitation
      description: |
        Platform Administrator or Root explicitly re-enters the trusted invitation
        dispatch path for a provisioning whose invitation was sent or ended with an
        unknown delivery outcome while its Owner is still unlinked and pending. The
        command records a fresh durable dispatch intent and an audit event; the
        trusted worker performs the actual send. It never accepts identity fields,
        never repeats an ambiguous delivery automatically, and is rejected once the
        Owner identity is linked or active.
      security:
        - humanOidc: [customers:write]
      parameters:
        - $ref: '#/components/parameters/CustomerProvisioningId'
      responses:
        '200':
          description: Re-dispatch authorized; the provisioning re-entered the trusted flow
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerProvisioning' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The invitation cannot be re-sent from the current state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCode' }

  /v1/support-contexts:
    post:
      tags: [BOKA control plane]
      operationId: createStaffSupportContext
      x-boka-implementation: implemented
      summary: Open a short-lived staff support context
      description: |
        Binds the exact active staff identity to one organization, one support purpose,
        a safe case reference and reason, and a server-controlled expiry. It does not
        impersonate a customer or accept an organization header as authority.
        The default purpose `customer-support-read` is read-only and open to every
        staff role. The purpose `customer-data-edit` (authority `read-write`) is
        reserved for Senior Operations and Root; it additionally permits the
        taxpayer, business-premise and catalogue writes listed on those operations
        and nothing else. Writes made under it are recorded in the customer's
        organization audit stream with `actorKind` `boka-staff`.
      security:
        - humanOidc: [support-contexts:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffSupportContextCreate' }
      responses:
        '201':
          description: Active staff support context
          headers:
            Location:
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffSupportContext' }
        '403':
          description: The staff role cannot open a context with the requested purpose (`STAFF_SUPPORT_CONTEXT_PURPOSE_FORBIDDEN`)
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationError'

