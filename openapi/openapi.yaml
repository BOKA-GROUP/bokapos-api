        draftId: { type: string, format: uuid, nullable: true }
        draftVersion: { type: integer, format: int64, nullable: true }
        draftState: { type: string, nullable: true, enum: [draft, approved, null] }
        documentId: { type: string, format: uuid, nullable: true }
        invoiceNumber: { type: string, nullable: true }
        issuanceState: { type: string, nullable: true, enum: [issued, submitted, outcome_unknown, demo, null] }
        vatState: { type: string, nullable: true, enum: [verified, submitted, outcome_unknown, null] }
        verificationState: { type: string, nullable: true }
        emailState: { type: string, nullable: true, enum: [smtp_accepted, not_sent, outcome_unknown, null] }
        lastOutcome: { type: string, nullable: true }
        lastOutcomeAt: { type: string, format: date-time, nullable: true }
        canIssueAndSend: { type: boolean }
        canPreview: { type: boolean }
    InvoiceMonth:
