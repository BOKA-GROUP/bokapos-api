  /v1/staff-security-elements/{staffSecurityElementId}/activation-jobs:
    get:
      tags: [BOKA security elements]
      operationId: listSecurityElementActivationJobs
      x-boka-implementation: implemented
      summary: List activation jobs for one customer security element
      security:
        - humanOidc: [staff:read]
      parameters:
        - $ref: '#/components/parameters/StaffSecurityElementId'
      responses:
        '200':
          description: Activation jobs, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecurityElementActivationJobPage' }
    post:
      tags: [BOKA security elements]
      operationId: requestSecurityElementActivationJob
      x-boka-implementation: implemented
      summary: Authorize a staff-triggered activation of a pending production element
      description: |
        Security Administrator or Root commits a durable activation job before any
        supplier call. The trusted worker then runs the unchanged metadata verification
        and proves the element with one Training (Obuka) receipt signed by V-PFR, which
        creates no fiscal liability, and activates the element only after the stored
        signed response and the independent public receipt verification succeed. Sandbox
        elements activate through pool assignment and are refused here. One open job per
        element; a failed job records a safe code and may be followed by a new job, which
        reuses the already reserved fiscal operation and never resubmits blindly.
      security:
        - humanOidc: [staff:write]
      parameters:
        - $ref: '#/components/parameters/StaffSecurityElementId'
      responses:
        '202':
          description: Activation job queued for the trusted worker
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecurityElementActivationJob' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Not pending, not a production element, or a job is already open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCode' }
        '503':
          description: The activation job worker is not enabled in this environment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCode' }

