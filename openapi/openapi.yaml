    SefDemoSubmission:
      type: object
      required: [documentId, environment, state, requestId, ublSha256, startedAt, registrationCheckedAt, invoiceId, salesInvoiceId, purchaseInvoiceId, verificationState, externalStatus, retryAllowed]
      properties:
        documentId: { type: string, format: uuid }
