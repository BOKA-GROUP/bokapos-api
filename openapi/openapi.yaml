        taxIdentifier: { type: string, pattern: '^[0-9]{9}$' }
        legalName: { type: string }
        registrationNumber:
          type: string
          nullable: true
          pattern: '^[0-9]{8}$'
          description: Serbian registration number (matični broj), usually prefilled from the company registry lookup.
        address: { type: string, nullable: true, maxLength: 300 }
        city: { type: string, nullable: true, maxLength: 100 }
        municipality: { type: string, nullable: true, maxLength: 100 }
        activityCode: { type: string, nullable: true, pattern: '^[0-9]{4}$' }
        activityName: { type: string, nullable: true, maxLength: 150 }

        vatStatus:
          type: [string, 'null']
          enum: [in_vat, not_in_vat, null]
          description: Owner-declared VAT status. not_in_vat restricts every fiscal command to the non-VAT tax label (category N-TAX, label А in production); null means not declared and restricts nothing.
    TaxpayerUpdate:
      type: object
      additionalProperties: false
      required: [legalName, status]
      description: Registry profile fields omitted from the request stay unchanged; a blank string clears a field. A closed taxpayer is immutable in every field.
      properties:
        legalName: { type: string, minLength: 1, maxLength: 300 }
        status: { type: string, enum: [active, suspended, closed] }
        registrationNumber:
          type: string
          nullable: true
          pattern: '^[0-9]{8}$'
          description: Serbian registration number (matični broj), usually prefilled from the company registry lookup.
        address: { type: string, nullable: true, maxLength: 300 }
        city: { type: string, nullable: true, maxLength: 100 }
        municipality: { type: string, nullable: true, maxLength: 100 }
        activityCode: { type: string, nullable: true, pattern: '^[0-9]{4}$' }
        activityName: { type: string, nullable: true, maxLength: 150 }

        vatStatus:
          type: [string, 'null']
          enum: [in_vat, not_in_vat, null]
          description: Owner-declared VAT status. not_in_vat restricts every fiscal command to the non-VAT tax label (category N-TAX, label А in production); null means not declared and restricts nothing.
