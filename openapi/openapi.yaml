    get:
      tags: [BOKA control plane]
      operationId: getCustomerProvisioning
      x-boka-implementation: implemented
      summary: Retrieve safe customer-provisioning state
      security:
        - humanOidc: [customers:read]
      parameters:
        - $ref: '#/components/parameters/CustomerProvisioningId'
      responses:
        '200':
          description: Customer-provisioning state
          content:
