        - humanOidc: [tenant:read]
      parameters:
        - $ref: '#/components/parameters/TaxpayerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptDeliveryPreviewRequest'
      responses:
        '200':
          description: The sample message
          content:
            text/html:
              schema: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/receipt-delivery-settings/taxpayers/{taxpayerId}/test-messages:
    post:
      tags: [Receipt delivery]
      operationId: sendReceiptDeliveryTestMessage
      x-boka-implementation: implemented
      summary: Send a sample receipt e-mail to one address
      description: |
        Owner or Administrator. Sends the sample message built from the saved
