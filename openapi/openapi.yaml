      description: One customer pickup. It never contains a secret.
      required: [id, status, createdAt, expiresAt, noticeOutcome, noticeRecipientCount]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ApiCredentialHandoffStatus' }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revealedAt: { type: string, format: date-time, nullable: true }
        noticeOutcome: { type: string, enum: [sent, partially-sent, not-sent, no-recipients, unconfigured] }
        noticeRecipientCount: { type: integer, minimum: 0 }
        pickupUrl:
          type: string
          format: uri
          nullable: true
          description: Portal link while the pickup is pending. It opens the pickup page and grants nothing without the member's own sign-in.

    ApiCredentialHandoffStatus:
      type: string
      enum: [pending, revealing, revealed, outcome-unknown, cancelled, expired]

    OrganizationApiCredential:
      type: object
      additionalProperties: false
      required: [id, environment, clientId, displayName, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        environment: { $ref: '#/components/schemas/FiscalEnvironment' }
        clientId: { type: string }
        displayName: { type: string }
        status: { type: string, enum: [pending, active, revoked] }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time, nullable: true }
        handoff:
          type: object
          nullable: true
          additionalProperties: false
          required: [id, status, createdAt, expiresAt]
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/ApiCredentialHandoffStatus' }
            createdAt: { type: string, format: date-time }
            expiresAt: { type: string, format: date-time }
            revealedAt: { type: string, format: date-time, nullable: true }
            revealedByDisplayName: { type: string, nullable: true }

    OrganizationApiCredentialPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OrganizationApiCredential' }

    AiConnectionPermission:
      type: string
      enum: [fiscal-documents, refunds, advances, proforma-training, catalogue]
      description: |
        One write toggle; reading is always granted. fiscal-documents adds
        fiscal:write (sales, official copies and receipt e-mail), refunds adds
        refund:write, advances adds advance:write and advance:close,
        proforma-training adds proforma-training:write, catalogue adds
        catalogue:write.

    AiConnectionClientApplication:
      type: object
      additionalProperties: false
      required: [name, clientId, redirectHost]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, examples: [Claude] }
        clientId:
          type: string
          minLength: 1
          maxLength: 500
          description: The app's OAuth client id at the MCP gateway, a Client ID Metadata Document URL or a registered id.
        redirectHost: { type: string, maxLength: 253, examples: [claude.ai] }

    AiConnectionCreate:
      type: object
      additionalProperties: false
      required: [consentRequestId, environment, displayName, clientApplication, permissions]
      properties:
        consentRequestId:
          type: string
          pattern: '^[A-Za-z0-9._~-]{16,100}$'
          description: The gateway's id for the approval; one approval yields one connection.
        environment: { $ref: '#/components/schemas/FiscalEnvironment' }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        clientApplication: { $ref: '#/components/schemas/AiConnectionClientApplication' }
        permissions:
          type: array
          maxItems: 5
          uniqueItems: true
          items: { $ref: '#/components/schemas/AiConnectionPermission' }
          description: An empty list grants read-only access.
        productionWritesAcknowledged:
          type: boolean
          description: "Required true for production with any write permission: the member confirmed that the AI app issues real fiscal receipts."

    AiConnectionUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        permissions:
          type: array
          maxItems: 5
          uniqueItems: true
          items: { $ref: '#/components/schemas/AiConnectionPermission' }
        productionWritesAcknowledged:
          type: boolean
          description: "Required true when this change turns on a write permission of a production connection."

    AiConnection:
      type: object
      additionalProperties: false
      required: [id, environment, displayName, clientApplication, permissions, scopes, oauthClientId, status, providerSyncPending, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        environment: { $ref: '#/components/schemas/FiscalEnvironment' }
        displayName: { type: string }
        clientApplication: { $ref: '#/components/schemas/AiConnectionClientApplication' }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/AiConnectionPermission' }
        scopes:
          type: array
          items: { type: string }
          description: The OAuth scopes the permissions map to, read scopes included.
        oauthClientId:
          type: string
          description: The identity-provider client the MCP gateway authenticates as for this connection. It has no secret.
        status: { type: string, enum: [pending, active, revoked, failed] }
        providerSyncPending:
          type: boolean
          description: True while recorded permissions are not yet applied at the identity provider.
        approvedBy: { type: string, nullable: true, description: The approving member's display name. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time, nullable: true }

    AiConnectionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AiConnection' }

    ApiCredentialReveal:
      type: object
      additionalProperties: false
      required: [handoffId, apiCredentialId, environment, clientId, displayName, secret, revealedAt]
      properties:
        handoffId: { type: string, format: uuid }
        apiCredentialId: { type: string, format: uuid }
        environment: { $ref: '#/components/schemas/FiscalEnvironment' }
        clientId: { type: string }
        displayName: { type: string }
        secret:
          type: string
          description: The newly generated client secret. Returned once; BokaPOS never stores it.
        revealedAt: { type: string, format: date-time }

    ApiCredentialPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiCredential' }

    FiscalEnvironment:
      type: string
      enum: [sandbox, production]
      description: |
        The Stripe-style fiscal environment. Machine credentials carry exactly
        one environment and may only use security elements of that
        environment; sandbox elements are BOKA-assigned and route to the
        TaxCore sandbox, production elements are the customer's own.
        Taxpayers and business premises carry the environment too: the BOKA
        sandbox taxpayer and premise created by a pool assignment are
        sandbox, everything a human registers is production, and setup
        registered by a machine credential belongs to that credential's
        environment. A premise inherits its taxpayer's environment and a
        security element can only be bound to a premise of its own.

    SecurityElementUploadSession:
      type: object
      required: [id, uploadUrl, encryptionKey, environment, expiresAt, status]
      properties:
        id: { type: string, format: uuid }
        uploadUrl: { type: string, format: uri-reference }
        environment: { $ref: '#/components/schemas/FiscalEnvironment' }
        encryptionKey:
          type: object
          description: Public RSA JWK used to encrypt the complete upload payload.
          additionalProperties: false
          required: [kty, use, alg, kid, n, e]
          properties:
            kty: { type: string, const: RSA }
            use: { type: string, const: enc }
            alg: { type: string, const: RSA-OAEP-256 }
            kid: { type: string }
            n: { type: string }
            e: { type: string }
        expiresAt: { type: string, format: date-time }
        status: { type: string, enum: [pending, completed] }

    SecurityElementUploadPayload:
      type: object
      additionalProperties: false
      required: [uploadSessionId, pfxPassword, pak]
      description: Plaintext schema before compact-JWE encryption; never send this object directly.
      oneOf:
        - required: [archiveBase64]
        - required: [pfxBase64]
      properties:
        uploadSessionId:
          type: string
          format: uuid
          description: Must equal the session ID in the one-time upload URL.
        jid:
          type: string
          pattern: '^[A-Z0-9]{8}$'
          description: Optional. The JID is read from the certificate subject serialNumber; when supplied it must match that value.
        archiveBase64:
          type: string
          format: byte
          description: Original supplier ZIP; preferred for owner self-service onboarding.
        pfxBase64:
          type: string
          format: byte
          description: Extracted PFX for controlled integration clients; mutually exclusive with archiveBase64.
        pfxPassword:
          type: string
          pattern: '^[A-Z0-9]{8}$'
          writeOnly: true
        pak:
          type: string
          pattern: '^[A-Z0-9]{6}$'
          writeOnly: true

    SecurityElement:
      type: object
      additionalProperties: false
      required:
        - id
        - taxpayerId
        - businessPremiseId
        - environment
        - jid
        - certificateThumbprint
        - certificateSubject
        - certificateIssuer
        - certificateSerialNumber
        - certificateNotBefore
        - certificateNotAfter
        - certificateExpiryStatus
        - replacementRecommended
        - status
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        taxpayerId: { type: string, format: uuid }
        businessPremiseId: { type: string, format: uuid }
        environment: { $ref: '#/components/schemas/FiscalEnvironment' }
        jid: { type: string }
        certificateThumbprint: { type: string }
        certificateSubject: { type: string }
        certificateIssuer: { type: string }
        certificateSerialNumber: { type: string }
        certificateNotBefore: { type: string, format: date-time }
        certificateNotAfter: { type: string, format: date-time }
        certificateExpiryStatus:
          type: string
          enum: [not-yet-valid, current, warning, critical, expired]
          description: Server-evaluated public-certificate time status using the configured 30-day warning and 7-day critical windows by default.
        replacementRecommended:
          type: boolean
          description: True for a non-retired element whose public certificate is inside the warning window or expired; this is not proof of revocation or V-PFR status.
        status:
          type: string
          enum: [pending-verification, active, suspended, retired]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        onboarding:
          type: [object, 'null']
          additionalProperties: false
          description: |
            Present only in the upload-completion response (null or absent
            elsewhere): the safe names of the taxpayer and business premise
            the element was bound to, read from the stored records, and
            whether each record was created by this upload. Never secret
            material.
          required: [taxIdentifier, taxpayerLegalName, taxpayerCreated, businessPremisePuIdentifier, businessPremiseName, premiseCreated]
          properties:
            taxIdentifier: { type: string }
            taxpayerLegalName: { type: string }
            taxpayerCreated: { type: boolean }
            businessPremisePuIdentifier: { type: string }
            businessPremiseName: { type: string }
            premiseCreated: { type: boolean }

    FiscalDocumentPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FiscalDocument' }
        nextCursor: { type: [string, 'null'] }

    Conflict:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    IdempotencyConflict:
      type: object
      additionalProperties: false
      required: [code]
      description: |
        `IDEMPOTENCY_KEY_REUSED_WITH_DIFFERENT_REQUEST` names the original
        operation. `IDEMPOTENCY_KEY_REUSED_IN_OTHER_ENVIRONMENT` means the
        organization already used this key with a credential of the other
        fiscal environment; keys are unique per organization across both
        environments, so choose a new key rather than retrying.
      properties:
        code: { type: string }
        operationId: { type: string, format: uuid }
        message: { type: string }

    ErrorCode:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string }
        message: { type: string }

    ValidationProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, errors]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    LicenseState:
      type: string
      enum: [none, active, suspended, not-started, expired]
      description: Customer-facing licence state on the Belgrade calendar date of the request.

    LicensePriceList:
      type: object
      additionalProperties: false
      description: Prices in RSD with VAT included. The base price is per active production security element per month; modules are per organization per month.
      required: [basePricePerElement, includedDocuments, overageDocumentPrice, advanceModulePrice, emailModulePrice, vatRate]
      properties:
        basePricePerElement: { type: number }
        includedDocuments: { type: integer }
        overageDocumentPrice: { type: number }
        advanceModulePrice: { type: number }
        emailModulePrice: { type: number }
        vatRate: { type: number, description: Fraction, 0.2 for 20% VAT. }

    License:
      type: object
      additionalProperties: false
      required: [id, status, startsOn, endsOn, advanceModuleEnabled, emailModuleEnabled, basePriceOverride, includedDocumentsOverride, overageDocumentPriceOverride, advanceModulePriceOverride, emailModulePriceOverride, effectivePrices, notes, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [active, suspended] }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date, nullable: true }
        advanceModuleEnabled: { type: boolean }
        emailModuleEnabled: { type: boolean }
        basePriceOverride: { type: number, nullable: true }
        includedDocumentsOverride: { type: integer, nullable: true }
        overageDocumentPriceOverride: { type: number, nullable: true }
        advanceModulePriceOverride: { type: number, nullable: true }
        emailModulePriceOverride: { type: number, nullable: true }
        effectivePrices:
          allOf:
            - $ref: '#/components/schemas/LicensePriceList'
          description: Recorded prices in force today. Monthly billing uses the prices and enabled modules effective on the last day of the service month.
        notes: { type: string, nullable: true, description: Internal staff notes; always null on customer reads. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LicenseSummary:
      type: object
      additionalProperties: false
      required: [state, productionFiscalizationAllowed, modules, startsOn, endsOn, prices]
      properties:
        state: { $ref: '#/components/schemas/LicenseState' }
        productionFiscalizationAllowed: { type: boolean }
        modules:
          type: object
          additionalProperties: false
          required: [advance, email]
          properties:
            advance: { type: boolean }
            email: { type: boolean }
        startsOn: { type: string, format: date, nullable: true }
        endsOn: { type: string, format: date, nullable: true }
        prices: { $ref: '#/components/schemas/LicensePriceList' }

    LicenseStatementLine:
      type: object
      additionalProperties: false
      required: [kind, securityElementId, jid, label, billedDays, periodDays, unitPrice, quantity, amount, billedFrom, billedThrough]
      properties:
        kind: { type: string, enum: [base-element, module-advance, module-email, overage] }
        securityElementId: { type: string, format: uuid, nullable: true }
        jid: { type: string, nullable: true }
        label: { type: string, nullable: true }
        billedDays: { type: integer }
        periodDays: { type: integer }
        unitPrice: { type: number }
        quantity: { type: number }
        amount: { type: number }
        billedFrom: { type: string, format: date, nullable: true }
        billedThrough: { type: string, format: date, nullable: true }

    LicenseStatement:
      type: object
      additionalProperties: false
      description: One Belgrade calendar month. Open periods replay recorded term history and estimate uncovered legacy dates; base and module lines accrue through today, inclusive. Closed periods return the immutable approved facts. The included document allowance is not prorated. Period boundaries and periodDays describe the entire month. RSD with VAT included. A closed statement is not an issued invoice.
      required: [period, periodStart, periodEnd, licensed, licensedDays, periodDays, lines, fiscalizedDocuments, includedDocuments, overageDocuments, overageUnitPrice, grossTotal, netTotal, vatTotal, state, closedAt]
      properties:
        period: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        licensed: { type: boolean }
        licensedDays: { type: integer }
        periodDays: { type: integer }
        lines:
          type: array
          items: { $ref: '#/components/schemas/LicenseStatementLine' }
        fiscalizedDocuments: { type: integer, description: Production documents with a signed V-PFR response whose PFR time falls in the month and does not exceed the observation instant of this scoped read. }
        includedDocuments: { type: integer }
        overageDocuments: { type: integer }
        overageUnitPrice: { type: number }
        grossTotal: { type: number }
        netTotal: { type: number }
        vatTotal: { type: number }
        state: { type: string, enum: [estimate, closed, settled_without_invoice] }
        closedAt: { type: string, format: date-time, nullable: true }

    BillingPeriodClose:
      type: object
      additionalProperties: false
      required: [expectedSha256]
      properties:
        expectedSha256: { type: string, pattern: '^[0-9a-f]{64}$' }

    BillingTerms:
      type: object
      additionalProperties: false
      required: [status, startsOn, endsOn, advanceModuleEnabled, emailModuleEnabled]
      properties:
        status: { type: string, enum: [active, suspended] }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date, nullable: true }
        advanceModuleEnabled: { type: boolean }
        emailModuleEnabled: { type: boolean }

    BillingRevision:
      type: object
      additionalProperties: false
      required: [version, source, termsEffectiveOn, pricesEffectiveOn, terms, prices]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        source: { type: string, enum: [license-created, existing-observed, license-updated] }
        termsEffectiveOn: { type: string, format: date }
        pricesEffectiveOn: { type: string, format: date }
        terms: { $ref: '#/components/schemas/BillingTerms' }
        prices: { $ref: '#/components/schemas/LicensePriceList' }

    BillingPeriodReview:
      type: object
      additionalProperties: false
      required: [id, statement, contentSha256, requiresOpeningConfirmation, openingConfirmed, canClose, revisions, initialTerms, initialPrices]
      properties:
        id: { type: string, format: uuid, nullable: true }
        statement: { $ref: '#/components/schemas/LicenseStatement' }
        contentSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        requiresOpeningConfirmation: { type: boolean }
        openingConfirmed: { type: boolean }
        canClose: { type: boolean, description: The month has ended and is not already closed. Hash and initial-term validation are still required. }
        revisions:
          type: array
          items: { $ref: '#/components/schemas/BillingRevision' }
        initialTerms:
          allOf:
            - $ref: '#/components/schemas/BillingTerms'
          nullable: true
        initialPrices: { $ref: '#/components/schemas/LicensePriceList' }

    LicenseInvoice:
      type: object
      additionalProperties: false
      required: [id, period, invoiceNumber, issuedOn, dueOn, grossAmount, status, paidOn, note, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        period: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        invoiceNumber: { type: string, maxLength: 64 }
        issuedOn: { type: string, format: date }
        dueOn: { type: string, format: date, nullable: true }
        grossAmount: { type: number }
        status: { type: string, enum: [issued, paid, cancelled] }
        paidOn: { type: string, format: date, nullable: true }
        note: { type: string, nullable: true, maxLength: 500 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LicensedElement:
      type: object
      additionalProperties: false
      required: [id, jid, premiseName, status, activatedAt, deactivatedAt]
      properties:
        id: { type: string, format: uuid }
        jid: { type: string }
        premiseName: { type: string }
        status: { type: string, enum: [pending-verification, active, suspended, retired] }
        activatedAt: { type: string, format: date-time, nullable: true }
        deactivatedAt: { type: string, format: date-time, nullable: true }

    Billing:
      type: object
      additionalProperties: false
      required: [organizationName, state, license, priceList, currentStatement, previousStatements, invoices, productionElements, today]
      properties:
        organizationName: { type: string }
        state: { $ref: '#/components/schemas/LicenseState' }
        license:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/License'
        priceList: { $ref: '#/components/schemas/LicensePriceList' }
        currentStatement: { $ref: '#/components/schemas/LicenseStatement' }
        previousStatements:
          type: array
          items: { $ref: '#/components/schemas/LicenseStatement' }
        invoices:
          type: array
          items: { $ref: '#/components/schemas/LicenseInvoice' }
        productionElements:
          type: array
          items: { $ref: '#/components/schemas/LicensedElement' }
        today: { type: string, format: date }

    StaffLicenseWrite:
      type: object
      additionalProperties: false
      required: [status, startsOn, advanceModuleEnabled, emailModuleEnabled]
      properties:
        status: { type: string, enum: [active, suspended] }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date, nullable: true }
        advanceModuleEnabled: { type: boolean }
        emailModuleEnabled: { type: boolean }
        basePriceOverride: { type: number, nullable: true }
        includedDocumentsOverride: { type: integer, nullable: true }
        overageDocumentPriceOverride: { type: number, nullable: true }
        advanceModulePriceOverride: { type: number, nullable: true }
        emailModulePriceOverride: { type: number, nullable: true }
        notes: { type: string, nullable: true, maxLength: 1000 }

    StaffLicenseInvoiceCreate:
      type: object
      additionalProperties: false
      required: [period, invoiceNumber, issuedOn, grossAmount]
      properties:
        period: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        invoiceNumber: { type: string, maxLength: 64 }
        issuedOn: { type: string, format: date }
        grossAmount: { type: number, minimum: 0, exclusiveMinimum: true, description: Positive invoice charge; zero-charge periods have no invoice. }
        dueOn: { type: string, format: date, nullable: true }
        note: { type: string, nullable: true, maxLength: 500 }

    StaffLicenseInvoiceUpdate:
      type: object
      additionalProperties: false
      required: [invoiceNumber, issuedOn, grossAmount, status]
      properties:
        invoiceNumber: { type: string, maxLength: 64 }
        issuedOn: { type: string, format: date }
        grossAmount: { type: number, minimum: 0, exclusiveMinimum: true, description: Original positive invoice charge, including when fully paid. }
        status: { type: string, enum: [issued, paid, cancelled] }
        dueOn: { type: string, format: date, nullable: true }
        paidOn: { type: string, format: date, nullable: true }
        note: { type: string, nullable: true, maxLength: 500 }

    StaffLicenseListItem:
      type: object
      additionalProperties: false
      required: [organizationId, organizationName, state, license, activeProductionElements, currentPeriod, unpaidInvoices]
      properties:
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        state: { $ref: '#/components/schemas/LicenseState' }
        license:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/License'
        activeProductionElements: { type: integer }
        currentPeriod:
          type: object
          additionalProperties: false
          required: [period, fiscalizedDocuments, estimatedGrossTotal]
          properties:
            period: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
            fiscalizedDocuments: { type: integer }
            estimatedGrossTotal: { type: number }
        unpaidInvoices: { type: integer }

    StaffLicensePage:
      type: object
      additionalProperties: false
      required: [items, priceList, today]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StaffLicenseListItem' }
        priceList: { $ref: '#/components/schemas/LicensePriceList' }
        today: { type: string, format: date }

    StaffLicenseDetail:
      type: object
      additionalProperties: false
      required: [organizationId, organizationName, state, license, priceList, statements, invoices, productionElements, today]
      properties:
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        state: { $ref: '#/components/schemas/LicenseState' }
        license:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/License'
        priceList: { $ref: '#/components/schemas/LicensePriceList' }
        statements:
          type: array
          description: The current month first, then previous months, newest first.
          items: { $ref: '#/components/schemas/LicenseStatement' }
        invoices:
          type: array
          items: { $ref: '#/components/schemas/LicenseInvoice' }
        productionElements:
          type: array
          items: { $ref: '#/components/schemas/LicensedElement' }
        today: { type: string, format: date }
