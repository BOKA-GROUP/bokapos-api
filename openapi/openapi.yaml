  /v1/buyer-registry-lookups:
    get:
      tags: [Fiscal documents]
      operationId: lookupBuyerRegistry
      x-boka-implementation: implemented
      summary: Preview the buyer lines a receipt will print for a company buyer PIB
      description: |
        For the cashier screens. Given a valid nine-digit PIB, returns the legal name,
        registration number, address and city the receipt will print under the buyer
        identification, answered from the organization's stored registry answer when it
        is younger than 24 hours and otherwise from the NBS unified account register with
        a five-second bound. Issuance resolves the same facts again through the same path
        and stores them with the document; this route stores nothing on any receipt.
        Any customer human who may issue receipts (Owner, Administrator, Operator) may
        call it. Answers Cache-Control: no-store.
      security:
        - humanOidc: [fiscal:write]
      parameters:
        - name: taxIdentifier
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9]{9}$' }
          description: Nine-digit Serbian PIB of the buyer (mod-11 checked).
      responses:
        '200':
          description: Buyer facts the receipt will print
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuyerRegistryLookup' }
        '404':
          description: The register holds no company for the PIB, or it could not answer within the bound (code BUYER_NOT_FOUND); the receipt will carry the buyer identification alone
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: No stored answer and the company registry is not configured (code COMPANY_REGISTRY_UNCONFIGURED)

  /v1/company-registry-lookups:
    get:
      tags: [Taxpayer onboarding]
      operationId: lookupCompanyRegistry
      x-boka-implementation: implemented
      summary: Look up a company in the NBS unified account register by PIB or registration number
      description: |
        Read-only prefill aid for the customer taxpayer form. Owner or Administrator
        humans supply exactly one of taxIdentifier (nine-digit PIB, mod-11 checked) or
        registrationNumber (eight-digit matični broj). The API queries the National
        Bank of Serbia register fresh on every call, stores nothing, returns the
        aggregated company with every account and its blockade flag, and answers
        Cache-Control: no-store. Registry data is a human prefill aid, never fiscal input.
      security:
        - humanOidc: [tenant:write]
      parameters:
        - $ref: '#/components/parameters/CompanyRegistryTaxIdentifier'
        - $ref: '#/components/parameters/CompanyRegistryRegistrationNumber'
      responses:
        '200':
          description: Company found in the register
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyRegistryLookup' }
        '404':
          description: The register holds no company for the identifier (code COMPANY_NOT_FOUND)
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          description: The register rejected the request or is unreachable (code COMPANY_REGISTRY_*)
        '503':
          description: The company registry lookup is not configured (code COMPANY_REGISTRY_UNCONFIGURED)

