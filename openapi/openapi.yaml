  /v1/human-access-audit-events:
    get:
      tags: [BOKA control plane]
      operationId: listHumanAccessAuditEvents
      x-boka-implementation: implemented
      summary: Read the redacted human-access event stream visible to the active staff identity
      description: |
        Support, Operations, and Security Administrator receive only events produced by
        their exact managed identity. Platform Administrator and Root receive the platform
        stream. The response deliberately omits actor issuer/subject, email, raw metadata,
        case reason, digests, provider failures, and secret references. This route does not
        accept a staff support context and does not grant tenant-read authority.
      security:
        - humanOidc: [staff:read]
      parameters:
        - name: eventType
          in: query
          schema: { type: string, maxLength: 100, pattern: '^human-access\.' }
        - name: outcome
          in: query
          schema: { type: string, enum: [accepted, rejected, succeeded, unknown] }
        - name: organizationId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/HumanAccessAuditCursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Redacted human-access audit page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HumanAccessAuditPage' }
        '400':
          $ref: '#/components/responses/ValidationError'
