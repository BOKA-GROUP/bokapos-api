        '200':
          description: Revoked credential
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiCredential' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A failed credential cannot be revoked
        '502':
          description: The identity provider rejected or failed the operation
        '503':
          description: The identity provider for API credentials is not configured

  /v1/api-credentials/{apiCredentialId}/handoffs:
    post:
      tags: [BOKA control plane]
      operationId: createApiCredentialHandoff
      x-boka-implementation: implemented
      summary: Open a new one-time customer pickup for an active credential
      description: |
        Staff-only. Closes any open pickup of the credential (an interrupted
        reveal closes as outcome-unknown), opens a new pickup valid for seven
        days and emails the organization's active Owners and Administrators a
        notice with the portal link. The secret does not change until the
        customer reveals it, so this is both re-delivery and rotation.
      security:
        - humanOidc: [customers:write]
      parameters:
        - name: apiCredentialId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: The credential with its new open pickup; no secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiCredential' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The credential is not active, or a concurrent change won (`API_CREDENTIAL_HANDOFF_CHANGED`)
        '503':
          description: The identity provider for API credentials is not configured

  /v1/organization-api-credentials:
    get:
      tags: [Organization API credentials]
      operationId: listOrganizationApiCredentials
      x-boka-implementation: implemented
      summary: List the organization's API credentials and their pickups
      description: |
        Active Owners and Administrators only. Safe metadata: the client id,
        environment, status and the latest pickup. No secret, issuing staff
        identity or provider detail is ever returned.
      security:
        - humanOidc: [tenant:read]
      responses:
        '200':
          description: The organization's credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationApiCredentialPage' }
        '403':
          description: Not an active Owner or Administrator of the organization

  /v1/organization-api-credentials/handoffs/{apiCredentialHandoffId}/reveal:
    post:
      tags: [Organization API credentials]
      operationId: revealApiCredentialHandoff
      x-boka-implementation: implemented
      summary: Reveal a pending pickup once and receive a newly generated secret
      description: |
        Active Owners and Administrators only. The pickup is claimed in
        PostgreSQL first; only then does the identity provider generate the new
        secret, which is returned in this response exactly once with
        `Cache-Control: no-store` and is never stored. A second call, another
        member or a replay receives `409`. A provider failure that proves the
        old secret unchanged leaves the pickup pending; a possible rotation
        whose answer was lost closes it as `outcome-unknown`
        (`API_CREDENTIAL_SECRET_ROTATION_UNKNOWN`), and staff open a new one.
      security:
        - humanOidc: [tenant:write]
      parameters:
        - name: apiCredentialHandoffId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The one-time secret
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiCredentialReveal' }
        '403':
          description: Not an active Owner or Administrator of the organization
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already revealed, in progress, cancelled, outcome unknown, or the credential is no longer active
        '410':
          description: The pickup expired (`API_CREDENTIAL_HANDOFF_EXPIRED`)
        '502':
          description: The identity provider failed; the code says whether the pickup is still pending
        '503':
          description: The identity provider for API credentials is not configured

  /v1/ai-connections:
    get:
      tags: [AI connections]
      operationId: listAiConnections
      x-boka-implementation: implemented
      summary: List the organization's AI assistant connections
      description: |
        Active Owners and Administrators only. Safe metadata for every
        connection that was not refused at creation: the requesting app, the
        environment, the granted permissions and the OAuth scopes they map to.
        No secret exists for a connection. Responses carry
        `Cache-Control: no-store`.
      security:
        - humanOidc: [tenant:read]
      responses:
        '200':
          description: The organization's AI connections, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiConnectionPage' }
        '403':
          description: Not an active Owner or Administrator of the organization
    post:
      tags: [AI connections]
      operationId: createAiConnection
      x-boka-implementation: implemented
      summary: Record an AI connection the Owner or Administrator approved in the MCP consent screen
      description: |
        Called by the BokaPOS MCP gateway with the approving member's own
        token; a token issued to any other client (including the portal) is
        refused with `403` and `AI_CONNECTION_CONSENT_CLIENT_REQUIRED`. Reading
        is always granted. Each permission adds scopes of the standard
        integration bundle, so a connection never exceeds an API key, its
        organization or its environment. The row is committed before the
        identity provider creates the connection's client, which only the
        gateway's published keys can authenticate as. Repeating the same
        `consentRequestId` for the same approval answers `200` with the
        original connection; any other reuse is `409`
        `AI_CONNECTION_CONSENT_REQUEST_CONFLICT`. At most the configured number
        of active connections per organization (`AI_CONNECTION_LIMIT_REACHED`).
        AI connections are included in every licence.
        Production with any write permission needs `productionWritesAcknowledged`
        set to true (the approving member confirmed that the AI app issues real
        fiscal receipts on the taxpayer's behalf); otherwise `422`
        `AI_CONNECTION_PRODUCTION_ACKNOWLEDGEMENT_REQUIRED`. Who acknowledged,
        and when, is recorded on the connection. If the identity provider fails,
        any client it may have created is deleted.
      security:
        - humanOidc: [tenant:write]
        - humanOidc: [ai-connections:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiConnectionCreate' }
      responses:
        '200':
          description: Replay of the same approval; the original connection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiConnection' }
        '201':
          description: The connection is active
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiConnection' }
        '403':
          description: Not an active Owner or Administrator, or not the MCP gateway's consent client
        '409':
          description: The consent request id was used for another approval, or the organization reached its connection limit
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          description: The identity provider refused or failed; the connection is recorded as failed
        '503':
          description: AI connections are not configured in this environment (`AI_CONNECTION_PROVIDER_UNCONFIGURED`)

  /v1/ai-connections/{aiConnectionId}:
    get:
      tags: [AI connections]
      operationId: getAiConnection
      x-boka-implementation: implemented
      summary: Read one AI connection
      description: |
        Active Owners and Administrators only, within their own organization;
        a connection of another organization is `404`.
      security:
        - humanOidc: [tenant:read]
      parameters:
        - name: aiConnectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The connection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiConnection' }
        '403':
          description: Not an active Owner or Administrator of the organization
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [AI connections]
      operationId: updateAiConnection
      x-boka-implementation: implemented
      summary: Rename an AI connection or change its permissions
      description: |
        Active Owners and Administrators only. The new permissions are
        recorded first with `providerSyncPending: true`, then applied to the
        connection's client, removing scopes before adding any; the gateway's
        next token, at most a minute later, carries exactly the new scopes.
        If the provider fails the answer is `502` with
        `providerSyncPending: true`, the connection keeps the recorded
        permissions, and repeating the same request applies them. The
        environment and the requesting app never change.
        Turning on any write permission of a production connection needs
        `productionWritesAcknowledged` set to true, as approving one does;
        otherwise `422` `AI_CONNECTION_PRODUCTION_ACKNOWLEDGEMENT_REQUIRED`.
      security:
        - humanOidc: [tenant:write]
        - humanOidc: [ai-connections:write]
      parameters:
        - name: aiConnectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiConnectionUpdate' }
      responses:
        '200':
          description: The connection with the change applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiConnection' }
        '403':
          description: Not an active Owner or Administrator of the organization
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The connection is not active (`AI_CONNECTION_NOT_ACTIVE`) or changed concurrently (`AI_CONNECTION_CHANGED`)
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          description: The identity provider failed; the change is recorded and not yet applied
        '503':
          description: AI connections are not configured in this environment

  /v1/ai-connections/{aiConnectionId}/revoke:
    post:
      tags: [AI connections]
      operationId: revokeAiConnection
      x-boka-implementation: implemented
      summary: Revoke an AI connection
      description: |
        Active Owners and Administrators only. The connection's client is
        disabled first, so the gateway's next token request fails, then the
        connection is marked revoked; a token issued before stays valid for
        at most its one-minute lifetime. Revoking a revoked connection answers
        `200`. A connection still being created answers `409`
        `AI_CONNECTION_PENDING`.
        Removing deletes the connection's identity-provider client, so it can
        never authenticate again; the BokaPOS record and its audit stay.
      security:
        - humanOidc: [tenant:write]
        - humanOidc: [ai-connections:write]
      parameters:
        - name: aiConnectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The revoked connection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiConnection' }
        '403':
          description: Not an active Owner or Administrator of the organization
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The connection is still being created or was refused at creation
        '502':
          description: The identity provider failed; the connection is unchanged
        '503':
          description: AI connections are not configured in this environment

  /v1/license:
    get:
      tags: [Billing]
      operationId: getLicenseSummary
      x-boka-implementation: implemented
      summary: Read which paid capabilities the organization currently has
      description: |
        Any customer human or API client. Reports the licence state (none,
        active, suspended, not-started, expired), whether production
        fiscalization is currently allowed, which paid modules (Advance,
        E-mail) are enabled, and the effective prices in RSD with VAT included.
        Sandbox elements and sandbox traffic are never gated by licensing.
        A refused production command returns 403 with LICENSE_REQUIRED,
        LICENSE_NOT_STARTED, LICENSE_EXPIRED, LICENSE_SUSPENDED or
        MODULE_NOT_LICENSED before anything is reserved or sent to the V-PFR.
        Refunds of already fiscalized receipts and advance cancellations are
        never refused by licensing.
      security:
        - oauth2: [tenant:read]
        - humanOidc: [tenant:read]
      responses:
        '200':
          description: Licence summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LicenseSummary' }

  /v1/billing:
    get:
      tags: [Billing]
      operationId: getBilling
      x-boka-implementation: implemented
      summary: Owner billing overview
      description: |
        Customer Owner only. Returns the licence without internal notes, the
        platform price list, the current Belgrade calendar month's statement
        (computed from active production elements, enabled modules and the
        number of production documents that received a signed V-PFR response),
        the previous eleven monthly statements, the invoices BOKA recorded with
        their payment state, and the production elements. Payment never happens
        on the platform: BOKA issues every invoice outside it and Root records
        the outcome.
      security:
        - humanOidc: [tenant:read]
      responses:
        '200':
          description: Billing overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Billing' }

  /v1/staff-licenses:
    get:
      tags: [BOKA licensing]
      operationId: listStaffLicenses
      x-boka-implementation: implemented
      summary: List every organization with its licence state for BOKA Root
      description: |
        Root only. One row per organization: licence (or none), active
        production elements, the current month's document count and estimated
        gross total, and the number of unpaid invoices.
      security:
        - humanOidc: [staff:read]
      responses:
        '200':
          description: Organizations and their licences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffLicensePage' }

  /v1/staff-licenses/{organizationId}:
    get:
      tags: [BOKA licensing]
      operationId: getStaffLicense
      x-boka-implementation: implemented
      summary: Read one organization's licence, statements, invoices and elements
      security:
        - humanOidc: [staff:read]
      parameters:
        - $ref: '#/components/parameters/StaffLicenseOrganizationId'
      responses:
        '200':
          description: Licence detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffLicenseDetail' }
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [BOKA licensing]
      operationId: putStaffLicense
      x-boka-implementation: implemented
      summary: Issue or edit an organization's licence
      description: |
        Root only. Creates the licence on first write (201) and replaces it on
        later writes (200). The customer enters nothing. Every write records a
        customer-visible audit event (license.updated) and a staff audit event.
        Billing terms are also appended to immutable history. On later edits,
        changes apply on the recorded Belgrade calendar day. Monthly charges use
        prices, document allowance and enabled modules effective on the last day
        of the service month; production-element days remain prorated. Initial licence
        terms apply from their declared start. Closed periods never change.
        Licensing never changes fiscal data.
      security:
        - humanOidc: [staff:write]
      parameters:
        - $ref: '#/components/parameters/StaffLicenseOrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffLicenseWrite' }
      responses:
        '200':
          description: Updated licence detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffLicenseDetail' }
        '201':
          description: Licence issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffLicenseDetail' }
        '403':
          description: The request is already bound to a different organization
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Concurrent licence change (LICENSE_CHANGED); refresh before editing again.
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/staff-licenses/{organizationId}/invoices:
    post:
      tags: [BOKA licensing]
      operationId: createStaffLicenseInvoice
      x-boka-implementation: implemented
      summary: Record an invoice BOKA issued for one billing period
      description: |
        Root only. The invoice itself is issued outside the platform; this
        records its number, dates and gross amount so the Owner sees it on the
        billing page. Invoice numbers are unique per organization.
      security:
        - humanOidc: [staff:write]
      parameters:
        - $ref: '#/components/parameters/StaffLicenseOrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffLicenseInvoiceCreate' }
      responses:
        '201':
          description: Recorded invoice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LicenseInvoice' }
        '403':
          description: The request is already bound to a different organization
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The invoice number already exists for this organization
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/staff-licenses/{organizationId}/invoices/{invoiceId}:
    put:
      tags: [BOKA licensing]
      operationId: updateStaffLicenseInvoice
      x-boka-implementation: implemented
      summary: Correct a recorded invoice or record its payment
      security:
        - humanOidc: [staff:write]
      parameters:
        - $ref: '#/components/parameters/StaffLicenseOrganizationId'
        - name: invoiceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffLicenseInvoiceUpdate' }
      responses:
        '200':
          description: Updated invoice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LicenseInvoice' }
        '403':
          description: The request is already bound to a different organization
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The invoice number already exists for this organization
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/staff-licenses/{organizationId}/statements/{period}:
    get:
      tags: [BOKA licensing]
      operationId: reviewStaffBillingPeriod
      x-boka-implementation: implemented
      summary: Review monthly billing facts or read the immutable closed period
      description: Root only. Returns the exact approval hash, line dates, term history and initial facts requiring confirmation. This does not issue an invoice.
      security:
        - humanOidc: [staff:read]
      parameters:
        - $ref: '#/components/parameters/StaffLicenseOrganizationId'
        - $ref: '#/components/parameters/BillingPeriodKey'
      responses:
        '200':
          description: Monthly review or the stored closed statement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingPeriodReview' }
        '401':
          description: Authentication required
        '403':
          description: Active Root membership required
        '404':
          description: BILLING_LICENSE_NOT_FOUND
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/staff-licenses/{organizationId}/statements/{period}/close:
    post:
      tags: [BOKA licensing]
      operationId: closeStaffBillingPeriod
      x-boka-implementation: implemented
      summary: Close one reviewed calendar month without issuing an invoice
      description: |
        Root only. Requires a finished month and the exact content hash returned
        by review. Missing historic terms require explicit opening confirmation.
        Stores immutable source facts and one statement per organization/month.
        An identical replay returns the same stored result; conflicting content
        returns 409. Zero gross is settled_without_invoice and creates no invoice,
        number, PDF, payment, SEF/VAT request or delivery. Positive gross is closed
        and awaits the separate draft workflow. No reopen/delete route exists.
      security:
        - humanOidc: [staff:write]
      parameters:
        - $ref: '#/components/parameters/StaffLicenseOrganizationId'
        - $ref: '#/components/parameters/BillingPeriodKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillingPeriodClose' }
      responses:
        '200':
          description: Identical replay of the closed period
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingPeriodReview' }
        '201':
          description: Closed period, with Location pointing to its review resource
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingPeriodReview' }
        '401':
          description: Authentication required
        '403':
          description: Active Root required or organization scope mismatch
        '404':
          description: BILLING_LICENSE_NOT_FOUND
        '409':
          description: BILLING_PERIOD_NOT_ENDED, BILLING_PERIOD_HAS_RECORDED_INVOICE, BILLING_STATEMENT_CHANGED, BILLING_OPENING_CONFIRMATION_REQUIRED or BILLING_PERIOD_ALREADY_CLOSED
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/staff-invoice-customers:
    get:
      tags: [BOKA invoice drafts]
      operationId: listStaffInvoiceCustomers
      x-boka-implementation: implemented
      summary: Review billing customers and all BokaPOS account sources
      description: |
        Active Root membership is required. Customer and other staff roles have no access.
        Read-only, private/no-store projection of every account, its exact onboarding company and unique
        active Owner email. Missing/ambiguous facts require review. No automatic billing enrollment,
        TOS acceptance, supplier call, invoice, month closing or email is triggered.
      responses:
        '200':
          description: Saved or current result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceCustomerPage' }
        '400':
          description: Malformed request.
        '401':
          description: Authentication required.
        '403':
          description: Active Root membership required; support contexts are excluded.
        '404':
          description: Requested customer, draft or organization not found.
        '409':
          description: Version or source conflict; refresh the reviewed data.
        '422':
          description: Invalid company details, dates, items, self-invoice, zero or unsupported amount.

  /v1/staff-invoice-customers/{customerId}:
    put:
      tags: [BOKA invoice drafts]
      operationId: saveStaffInvoiceCustomer
      x-boka-implementation: implemented
      summary: Create or revise a billing customer with an immutable optional organization link
      description: |
        Active Root membership is required. Customer and other staff roles have no access.
        This flow stores BOKA-owned drafts only; it never reserves a number, issues an invoice,
        calls SEF, records VAT or sends email. Customer membership in SEF remains unverified.
        expectedVersion 0 creates the supplied ID; later writes require the current version.
        Organization-linked writes require the current accountSourceSha256 and accepted accountTermsReference,
        the exact onboarding company and active Owner email, electronic consent, and a Root-reviewed legal kind.
        Organization links cannot change. Existing draft approvals become ineffective after a profile change.
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceCustomerWrite' }
      responses:
        '200':
          description: Saved or current result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceCustomer' }
        '201':
          description: Saved or current result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceCustomer' }
        '400':
          description: Malformed request.
        '401':
          description: Authentication required.
        '403':
          description: Active Root membership required; support contexts are excluded.
        '404':
          description: Requested customer, draft or organization not found.
        '409':
          description: Version, source, organization mapping, legacy invoice or approval conflict; includes BILLING_ACCOUNT_SOURCE_CHANGED, BILLING_ACCOUNT_COMPANY_MISSING, BILLING_ACCOUNT_COMPANY_INACTIVE, BILLING_ACCOUNT_OWNER_UNRESOLVED, BILLING_ACCOUNT_SELF_INVOICE_UNSUPPORTED and BILLING_ACCOUNT_DETAILS_INCOMPLETE. Refresh the reviewed data.
        '422':
          description: Invalid company details, dates, items, self-invoice, zero or unsupported amount.

  /v1/staff-invoices/issuer-tax-profiles:
    get:
      tags: [BOKA invoice readiness]
      operationId: listInvoiceIssuerTaxProfiles
      x-boka-implementation: implemented
      summary: Read issuer tax profile history
      description: Active Root only; no support context. Append-only BOKA issuer profile for VAT-payer status, monthly periods, ordinary accounting and standard 20% BokaPOS service treatment. Explicit confirmation, exact expected version and server-resolved active Root author required. The initial profile may cover historical supplies; later revisions are chronological and prospective in Europe/Belgrade. Same-date versions supersede only future selection; issuance must freeze a specific ID/hash. Exact latest response replay is safe. Profiles do not enable production or classify other services.
      security:
        - humanOidc: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
      responses:
        '200':
          description: Read-only result or exact replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceIssuerTaxProfilePage' }
        '400': { description: Malformed request or page }
        '401': { description: Authentication required }
        '403': { description: Active Root membership required; support contexts refused }
    post:
      tags: [BOKA invoice readiness]
      operationId: recordInvoiceIssuerTaxProfile
      x-boka-implementation: implemented
      summary: Record an effective-dated issuer tax profile
      description: Active Root only; no support context. Append-only BOKA issuer profile for VAT-payer status, monthly periods, ordinary accounting and standard 20% BokaPOS service treatment. Explicit confirmation, exact expected version and server-resolved active Root author required. The initial profile may cover historical supplies; later revisions are chronological and prospective in Europe/Belgrade. Same-date versions supersede only future selection; issuance must freeze a specific ID/hash. Exact latest response replay is safe. Profiles do not enable production or classify other services.
      security:
        - humanOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceIssuerTaxProfileWrite' }
      responses:
        '200':
          description: Read-only result or exact replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceIssuerTaxProfile' }
        '201':
          description: Recorded profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceIssuerTaxProfile' }
        '400': { description: Malformed request or page }
        '401': { description: Authentication required }
        '403': { description: Active Root membership required; support contexts refused }
        '409': { description: Profile version or effective date changed }
