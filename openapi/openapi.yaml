  /v1/advance-cases:
    get:
      tags: [Advance workflows]
      operationId: listAdvanceCases
      x-boka-implementation: implemented
      summary: List advance chains for operator selection
      description: Returns tenant-scoped advance chains in most-recently-updated order so an operator can continue a chain without handling an internal identifier. Filters narrow by state, reference text and last change.
      security:
        - oauth2: [fiscal:read]
        - humanOidc: [fiscal:read]
      parameters:
        - name: taxpayerId
          in: query
          schema: { type: string, format: uuid }
        - name: businessPremiseId
          in: query
          schema: { type: string, format: uuid }
        - name: state
          in: query
          description: OPEN is every chain still in progress (including unknown-outcome states the operator must resolve); CLOSED and FAILED are terminal.
          schema: { type: string, enum: [OPEN, CLOSED, FAILED] }
        - name: search
          in: query
          description: Case-insensitive substring of the client reference.
          schema: { type: string, maxLength: 200 }
        - name: updatedFrom
          in: query
          description: Only chains changed at or after this instant. Any RFC 3339 offset is accepted and compared as an instant.
          schema: { type: string, format: date-time }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
      responses:
        '200':
          description: Recent advance chains
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdvanceCasePage' }
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Advance workflows]
      operationId: createAdvanceCase
      x-boka-implementation: implemented
      summary: Create a server-managed advance chain
      description: |
        Creates a Boka-owned, same-taxpayer/same-premise chain. External and
        pre-eFiscalization starting references are deliberately outside this
        bounded workflow.
      security:
        - oauth2: [advance:write]
        - humanOidc: [advance:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvanceCaseCreate'
      responses:
        '201':
          description: Advance case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvanceCase'
        '200':
          description: Idempotent replay of the same case creation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvanceCase'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/advance-cases/{advanceCaseId}:
    get:
      tags: [Advance workflows]
      operationId: getAdvanceCase
      x-boka-implementation: implemented
      summary: Retrieve an advance chain and recovery state
      security:
        - oauth2: [fiscal:read]
        - humanOidc: [fiscal:read]
      parameters:
        - $ref: '#/components/parameters/AdvanceCaseId'
      responses:
        '200':
          description: Advance case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvanceCase'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/advance-cases/{advanceCaseId}/payments:
    post:
      tags: [Advance workflows]
      operationId: fiscalizeAdvancePayment
      x-boka-implementation: implemented
      summary: Fiscalize the next Advance Sale in a chain
      description: |
        Boka references the immediately preceding fiscalized Advance Sale
        stored in this exact case. Any unresolved prior outcome blocks another
        payment, and a changed idempotent replay is rejected.
      security:
        - oauth2: [advance:write]
        - humanOidc: [advance:write]
      parameters:
        - $ref: '#/components/parameters/AdvanceCaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvancePaymentCreate'
      responses:
        '201':
          description: Fiscalized Advance Sale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalDocument'
        '200':
          description: Idempotent replay of the fiscalized Advance Sale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalDocument'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/PfrUnavailable'

  /v1/advance-cases/{advanceCaseId}/cancellations:
    post:
      tags: [Advance workflows]
      operationId: cancelAdvanceSale
      x-boka-implementation: implemented
      summary: Cancel the latest erroneous Advance Sale with a standalone Advance Refund
      description: |
        Issues an Advance Refund that repeats the complete latest Advance Sale of
        the open case, references it, and carries the seller's own PIB as the
        buyer (10:<PIB>), as the official cancellation procedure prescribes. The
        case stays open; the next Advance Sale chains to the sale before the
        cancelled one. Only the latest fiscalized Advance Sale can be cancelled.
      security:
        - oauth2: [advance:write]
        - humanOidc: [advance:write]
      parameters:
        - $ref: '#/components/parameters/AdvanceCaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvanceCancellationCreate'
      responses:
        '201':
          description: Fiscalized Advance Refund cancelling the Advance Sale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalDocument'
        '200':
          description: Idempotent replay of the fiscalized Advance Refund
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalDocument'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/PfrUnavailable'

  /v1/advance-cases/{advanceCaseId}/close:
    post:
      tags: [Advance workflows]
      operationId: closeAdvanceCase
      x-boka-implementation: implemented
      summary: Issue the Advance Refund and final Normal Sale
      description: |
        This is a recoverable two-document workflow. If the Advance Refund is
        fiscalized but the final Sale is confirmed not submitted, the response
        exposes the pending state and an idempotent replay retries only that
        stored final operation. An unknown outcome blocks instead of retrying.
        If the V-PFR rejects the Advance Refund, the case is `FAILED` with the
        rejection code, the refund document is `REJECTED`, and the final Sale
        reserved with it is never sent: it is closed as `NOT_FISCALIZED` with
        `ADVANCE_REFUND_NOT_FISCALIZED` and `retryable: false`. Open a new case
        to try again; a replay of the failed close re-drives nothing.
        This bounded operation closes the whole Boka-owned chain; partial and
        legacy/external realization remain unsupported. The Advance Refund is
        not a customer-delivery document.
      security:
        - oauth2: [advance:close]
        - humanOidc: [advance:close]
      parameters:
        - $ref: '#/components/parameters/AdvanceCaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvanceCaseClose'
      responses:
        '201':
          description: Closed advance case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvanceCloseResult'
        '200':
          description: Idempotent replay of an already closed case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvanceCloseResult'
        '202':
          description: Advance Refund is fiscalized; final Sale remains pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvanceCloseResult'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/PfrUnavailable'

  /v1/receipt-deliveries:
    get:
      tags: [Receipt delivery]
      operationId: listReceiptDeliveries
      x-boka-implementation: implemented
      summary: List the electronic deliveries of one fiscal document
      security:
        - oauth2: [fiscal:read]
        - humanOidc: [fiscal:read]
      parameters:
        - name: fiscalDocumentId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Deliveries in creation order (at most 100)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ReceiptDelivery' }
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Receipt delivery]
      operationId: createReceiptDelivery
      x-boka-implementation: implemented
      summary: Email a fiscalized receipt to the customer
      description: |
        Queues one email delivery of one fiscalized document from the platform
        mailbox, in the taxpayer's chosen language, with the official
        verification URL as an active link and the A4 PDF attached. Delivery is
        queued only after the signed result is durably stored, only when the
        taxpayer enabled email delivery in its settings
        (422 RECEIPT_DELIVERY_DISABLED otherwise; the taxpayer then delivers
        through its own system), and only while the platform transport is
        configured (503 RECEIPT_DELIVERY_UNAVAILABLE otherwise). An advance
        refund, and a copy of one, are refused with 422
        RECEIPT_DELIVERY_DOCUMENT_NOT_ISSUED_TO_BUYER: the official guideline
        never issues that document to the buyer, so send the final receipt of
        the advance case instead. Every other kind is delivered. A delivery
        outcome is never evidence of fiscalization. Tenant branding stays
        outside the fiscal receipt boundary.
      security:
        - oauth2: [fiscal:write]
        - humanOidc: [fiscal:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptDeliveryCreate'
      responses:
        '202':
          description: Delivery queued
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptDelivery'
        '200':
          description: Idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptDelivery'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: The platform mail transport is not configured

  /v1/receipt-deliveries/{receiptDeliveryId}:
    get:
      tags: [Receipt delivery]
      operationId: getReceiptDelivery
      x-boka-implementation: implemented
      summary: Read one electronic delivery
      security:
        - oauth2: [fiscal:read]
        - humanOidc: [fiscal:read]
      parameters:
        - name: receiptDeliveryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptDelivery'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/receipt-delivery-settings/taxpayers/{taxpayerId}:
