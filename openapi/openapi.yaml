        Renders the supplied draft branding onto a fixed sample receipt and
        returns the HTML.

        A branding change cannot be previewed on a real receipt: a receipt is
        bound to the immutable branding revision that was in force when it was
        issued, so the most recent document would show the branding it was issued
        with and would never reflect an edit.

        The preview is drawn through the same renderer, stylesheet and layout a
        real receipt uses, so it cannot drift away from what the printer
        produces. Nothing is reserved, stored or counted. Every value in the
        sample is unusable as a fiscal artefact: the invoice number is not a
        well-formed PFR number, the verification URL is under the reserved
        `.invalid` top-level domain and cannot resolve, and the page carries a
        banner naming it a sample. This operation is not a fiscal document route
        and never produces evidence of fiscalization.
      security:
        - humanOidc: [tenant:read]
      parameters:
        - name: taxpayerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiptBrandingProfileWrite' }
      responses:
        '200':
          description: Sample receipt rendered with the draft branding
          content:
            text/html:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

