      description: 'Active Root membership only; no support contexts. Binds the exact organization. Runs synchronously and in order the implementations the workers use: links the billing customer and gives it the default policy when missing, closes exactly the reviewed statement (expectedSourceSha256) if open, prepares and approves the draft, issues through the route chosen by the fresh SEF registration lookup and sends the BOKA PDF to the current Owner. It continues from whatever state exists, never creates a second invoice, never resends a started e-mail and never retries an unknown outcome; a zero charge settles without an invoice. A refusal before any step ran returns 409 with a code; a run that stops for review returns 200 with outcome needs_review and the reason.'
