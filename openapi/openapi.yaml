  /v1/customer-provisionings:
    get:
      tags: [BOKA control plane]
      operationId: listStaffCustomerDirectory
      x-boka-implementation: implemented
      summary: List the safe BOKA staff customer directory
      description: |
        Returns organization identity and provisioning lifecycle metadata needed to
        select a customer for an audited support context. It deliberately excludes
        Owner contact, membership, managed-identity, and failure details.
      security:
        - humanOidc: [customers:read]
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
        - name: status
          in: query
          schema:
            type: string
            enum:
              - pending-identity
              - identity-prepared
              - invitation-dispatching
              - invitation-sent
              - invitation-outcome-unknown
              - identity-conflict
              - identity-control-plane-failed
              - active
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Redacted customer-directory page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffCustomerDirectoryPage' }
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [BOKA control plane]
      operationId: createCustomerProvisioning
      x-boka-implementation: implemented
      summary: Provision a customer organization and its pending Owner
      description: |
        Platform Administrator or Root creates the server-generated organization,
        pending Owner membership, audit event, and durable identity-invitation intent
        atomically. The Owner remains unlinked and inactive until the trusted managed-
        identity continuation succeeds; this route never accepts identity or activation fields.
      security:
        - humanOidc: [customers:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerProvisioningCreate' }
      responses:
        '200':
          description: Idempotent replay of the original provisioning result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerProvisioning' }
        '201':
          description: Customer organization and pending Owner created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerProvisioning' }
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'

