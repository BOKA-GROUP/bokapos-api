    InvoiceEmailDemo:
      type: object
      required: [documentId, environment, state, recipient, fromAddress, messageId, mimeSha256, attachmentSha256, testConsentAt, startedAt, recordedAt, retryAllowed]
      properties:
        documentId: { type: string, format: uuid }
        environment: { type: string, enum: [demo] }
        state: { type: string, enum: [prepared, smtp_accepted, not_sent, outcome_unknown] }
        recipient: { type: string, format: email }
        fromAddress: { type: string, format: email }
        messageId: { type: string }
        mimeSha256: { type: string }
        attachmentSha256: { type: string }
        testConsentAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
