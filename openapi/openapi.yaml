    StaffSandboxElementCreate:
      type: object
      additionalProperties: false
      required: [pfxPassword, pak]
      description: |
        Staff-only pool intake. Supply exactly one of archiveBase64 (the original
        supplier ZIP, parsed with the same bounded reader as customer intake) or
        pfxBase64, plus the PFX password and PAK. JID and PIB are read from the
        certificate when omitted and must match it when supplied. The legal
        name defaults to the certificate subject `O`, the premise PU identifier
        to the subject `OU` (the premise code, `<locationId>-<name>`) and the
        premise name to the part of that code after the first hyphen; a
        certificate whose subject lacks them falls back to the informational
        BOKA values. Staff may still supply any of the three.
        Secrets travel once over TLS and are immediately protected into the
        dedicated pool custody store.
      properties:
        archiveBase64: { type: string, format: byte, description: 'Original supplier ZIP, at most 2 MB.' }
        pfxBase64: { type: string, format: byte }
        pfxPassword: { type: string, pattern: '^[A-Z0-9]{8}$' }
        pak: { type: string, pattern: '^[A-Z0-9]{6}$' }
        jid: { type: string, pattern: '^[A-Z0-9]{8}$' }
        taxpayerPib: { type: string, pattern: '^[0-9]{9}$' }
        taxpayerLegalName: { type: string, maxLength: 200 }
        premisePuIdentifier: { type: string, maxLength: 100 }
        premiseName: { type: string, maxLength: 200 }

    StaffSandboxElement:
      type: object
      additionalProperties: false
      required:
        - id
        - jid
        - taxpayerPib
        - taxpayerLegalName
        - premisePuIdentifier
        - premiseName
        - certificateThumbprint
        - certificateSubject
        - certificateIssuer
        - certificateSerialNumber
        - certificateNotBefore
        - certificateNotAfter
        - status
        - assignmentCount
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        jid: { type: string }
        taxpayerPib: { type: string }
        taxpayerLegalName: { type: string }
        premisePuIdentifier: { type: string }
        premiseName: { type: string }
        certificateThumbprint: { type: string }
        certificateSubject: { type: string }
        certificateIssuer: { type: string }
        certificateSerialNumber: { type: string }
        certificateNotBefore: { type: string, format: date-time }
        certificateNotAfter: { type: string, format: date-time }
        status: { type: string, enum: [verified, retired] }
        assignmentCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

