        - $ref: '#/components/parameters/TaxpayerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptDeliverySettingsWrite'
      responses:
        '200':
          description: Saved settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptDeliverySettings'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The taxpayer is closed
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/receipt-delivery-settings/taxpayers/{taxpayerId}/previews:
    post:
      tags: [Receipt delivery]
      operationId: previewReceiptDeliveryMessage
      x-boka-implementation: implemented
