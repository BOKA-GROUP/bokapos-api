        preparationId: { type: string, format: uuid, nullable: true }
        recipient: { type: string, format: email, nullable: true }
        fromAddress: { type: string, format: email }
        messageId: { type: string, nullable: true }
        mimeSha256: { type: string, nullable: true }
        preparedAt: { type: string, format: date-time, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        recordedAt: { type: string, format: date-time, nullable: true }
        sendingEnabled: { type: boolean }
        canPrepare: { type: boolean }
        canSend: { type: boolean }
        retryAllowed: { type: boolean, enum: [false] }
    InvoiceEmailDemoPrepare:
